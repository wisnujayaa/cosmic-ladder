<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Ladder 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">

<canvas id="gl"></canvas>
<canvas id="ov" aria-hidden="true"></canvas>

<div class="hud">
  <div class="brand"><i></i><span data-k="brand"></span></div>
  <div class="exp" id="exp"></div>
  <div class="span" id="span"></div>
  <div class="span marble" id="marble"></div>
</div>
<div class="search" role="search"><input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search"><ul id="qres" hidden></ul></div>

<div class="tools" id="strip"><button class="sidetog" id="sideTog" type="button" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#fff" stroke-width="2.2"/></svg></button><button class="tbtn" id="tLearn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/></svg></button><button class="tbtn" id="tMeasure" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button><button class="tbtn" id="tCine" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="tbtn" id="tFull" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="tbtn" id="tHelp" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg></button></div>
<nav class="rail" id="rail" aria-label="Levels"></nav>
<div class="scalebar" id="scalebar" aria-hidden="true"><div class="sbLab" id="sbLab"></div><div class="sbBar" id="sbBar"></div></div>
<div class="lvbanner" id="lvBanner" aria-hidden="true"><div class="bx"></div><div class="bn"></div></div>
<button class="tbtn cineexit" id="cineExit" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
<section class="panel mbox" id="mbox" hidden aria-live="polite"><div class="cardin"><div class="head"><div class="eyebrow" data-k5="measure"></div><button class="fold" id="mX" type="button"><span class="arrow" style="width:20px;height:20px;background:#2b2e36">✕</span></button></div><h3 id="mT"></h3><dl class="facts" id="mD"></dl></div></section>
<div class="side">
  <div class="panel clock">
    <div class="clockhead"><div class="lab hideS" data-k="clock"></div><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div></div>
    <div class="date" id="date"></div>
    <div class="rate" id="rate"></div>
    <div class="row">
      <button class="btn" id="play" type="button"></button>
      <button class="btn" id="today" type="button" data-k="today"></button>
      <button class="btn" id="real" type="button" data-k="real"></button>
      <button class="btn" id="snd" type="button" aria-pressed="true"></button>
      <button class="btn" id="narr" type="button"></button>
      <button class="btn" id="ccBtn" type="button" aria-pressed="true"></button>
      <button class="btn" id="evBtn" type="button"></button>
    </div>
    <div class="narset"><div class="lab" data-k6="style"></div><div class="vrow"><select id="nStyle"><option value="doc" data-k6="sDoc"></option><option value="poem" data-k6="sPoem"></option></select><button class="btn primary" id="recBtn" type="button" data-k6="rec"></button></div><div class="lab" data-k6="voice"></div><div class="vrow"><select id="voiceSel"></select><button class="btn" id="voiceTest" type="button"></button></div><p class="vnote" id="voiceNote" hidden></p><label class="lab" for="rateIn"><span data-k6="rate"></span> · <b id="rateV"></b></label><input id="rateIn" type="range" min="0.75" max="1.4" step="0.05" value="1"></div>
    <label class="speed lab" for="mul" data-k="speed"></label>
    <input class="speed" id="mul" type="range" min="-3" max="3" step="0.01" value="0">
    <div class="lab hideS" data-k="focus"></div>
    <div class="row" id="focus"></div>
  </div>
  <div class="panel layers">
    <div class="lab" data-k2="layers"></div>
    <div class="chips" id="chips"></div>
  </div>
  <nav class="panel ladder" id="ladder" aria-label="Levels"></nav>
</div>

<section class="panel card" id="card" aria-live="polite"><div class="cardin">
  <div class="head"><div class="eyebrow" id="eyebrow"></div><button class="fold" id="fold" type="button" aria-controls="cardBody"></button></div>
  <h2 id="lvTitle"></h2>
  <div class="body" id="cardBody">
    <p class="desc" id="lvDesc"></p>
    <p class="motion"><b data-k="motion"></b><span id="lvMove"></span></p>
    <p class="fact" id="lvFact"></p>
    <p class="note"><span data-k="note"></span> <button class="linkbtn" id="credBtn" type="button" data-k2="credits"></button></p>
    <p class="try"><b id="tryT"></b><button class="linkbtn" id="tryBtn" type="button"></button></p>
    <p class="help" id="help"></p>
  </div>
  <div class="controls">
    <button class="btn primary" id="tour" type="button"></button>
    <button class="btn" id="tourBack" type="button"></button>
    <button class="btn" id="prev" type="button"></button>
    <button class="btn" id="next" type="button"></button>
    <button class="btn" id="sky" type="button" data-k2="sky" hidden></button>
    <button class="btn" id="gmode" type="button" hidden></button>
    <button class="btn" id="recenter" type="button" data-k="recenter"></button>
    <input id="zoom" type="range" min="6.8" max="27.25" step="0.01" value="7.3" aria-label="Zoom">
  </div>
  <div class="tprog" id="tprog" hidden><i></i></div>
</div></section>

<section class="panel card" id="info" hidden aria-live="polite">
  <figure class="hero" id="inHero" hidden style="margin:0"><img id="inImg" alt=""><figcaption id="inCap"></figcaption></figure>
  <div class="cardin">
    <div class="head"><div class="eyebrow" id="inKind"></div><button class="fold" id="inClose" type="button"></button></div>
    <h2 id="inTitle"></h2>
    <div class="row"><button class="btn" id="inListen" type="button"></button></div>
    <dl class="facts" id="inFacts"></dl>
    <div id="inExtra"></div>
    <p class="desc" id="inDesc"></p>
    <div id="inXWrap"><p class="sub" id="inXT"></p><ul class="xlist" id="inX"></ul></div>
    <div id="inRWrap"><p class="sub" id="inRT"></p><div class="refs" id="inRefs"></div></div>
    <div class="controls" id="inCtl"><button class="btn primary" id="inFly" type="button"></button></div>
  </div>
</section>
<section class="intro" id="intro" aria-labelledby="introT"><div class="introIn">
  <div class="brand"><i></i><span data-k="brand"></span></div>
  <h1 id="introT" data-k4="introTitle"></h1>
  <p class="lede" data-k4="introSub"></p>
  <div class="row"><button class="btn primary" id="introTour" type="button" data-k4="introTour"></button><button class="btn" id="introBack" type="button"></button><button class="btn" id="introRec" type="button" data-k6="rec"></button><button class="btn" id="introFree" type="button" data-k4="introFree"></button><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="id">ID</button><button type="button" data-lang="en">EN</button></div></div>
  <p class="inote" data-k4="introNote"></p>
</div></section>
<div class="subs" id="subs" hidden aria-live="polite"><div class="subTag" id="subTag"></div><p class="subT" id="subT"></p></div>
<div class="tbar panel" id="tbar" hidden><button class="tbb" id="tbPrev" type="button"></button><button class="tbb" id="tbPlay" type="button"></button><button class="tbb" id="tbNext" type="button"></button><span class="tbLab" id="tbLab"></span><button class="tbb" id="tbStop" type="button"></button></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="js/astro.js"></script>
<script src="js/content.js"></script>
<script src="js/content2.js"></script>
<script src="js/moons_snd.js"></script>
<script src="js/extras.js"></script>
<script src="js/narr.js"></script>
<script src="js/learn.js"></script>
<script src="js/main/core.js"></script>
<script src="js/main/solar.js"></script>
<script src="js/main/deepsky.js"></script>
<script src="js/main/frame.js"></script>
<script src="js/main/ui.js"></script>
<script src="js/main/input.js"></script>
<script src="js/main/narration.js"></script>
<script src="js/main/tour.js"></script>
<script src="js/main/boot.js"></script>

</html>
