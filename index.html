 ['Tempat Neil Armstrong dan Buzz Aldrin menjadi manusia pertama yang berjalan di Bulan. Jejak kaki mereka kemungkinan masih ada, karena Bulan tidak punya angin atau hujan yang bisa menghapusnya.','Where Neil Armstrong and Buzz Aldrin became the first humans to walk on the Moon. Their footprints are probably still there, since the Moon has no wind or rain to erase them.'],

 [['Wahana Surveyor 7 mendarat di dekat tepinya pada 1968.'],['The Surveyor 7 lander touched down near its rim in 1968.']],{img:'img/tycho-crater.jpg',cap:'NASA/GSFC/Arizona State University (LRO)',refs:[wiki('Tycho_(lunar_crater)')]}),

 ['Gunung tertinggi di tata surya, hampir tiga kali tinggi Everest diukur dari dasar. Lerengnya sangat landai, sehingga orang yang berdiri di atasnya tidak akan merasa sedang di puncak gunung.','The tallest mountain in the solar system, nearly three times Everest’s height measured from its base. Its slopes are so gentle that someone standing on it would not feel they were on a mountain.'],

 ['Sistem ngarai raksasa yang panjangnya hampir seperlima keliling Mars. Jika diletakkan di Indonesia, ngarai ini akan membentang hampir sejauh Aceh ke Kupang.','A giant canyon system nearly a fifth of the way around Mars. On Earth it would stretch roughly across the entire continental United States.'],
 [['Namanya diambil dari wahana Mariner 9, yang menemukannya pada 1971–1972.'],['It is named after the Mariner 9 spacecraft, which discovered it in 1971–1972.']],{img:'img/valles-marineris.jpg',cap:'NASA/JPL-Caltech (Viking)',refs:[wiki('Valles_Marineris')]}),

 ['Bekas danau purba dengan delta sungai yang membatu. Rover Perseverance mengumpulkan sampel batuan di sini untuk dibawa ke Bumi oleh misi di masa depan, demi mencari jejak kehidupan mikroba purba.','A dried ancient lake with a fossilized river delta. The Perseverance rover is collecting rock samples here for a future mission to bring back to Earth, in the search for signs of ancient microbial life.'],
 [['Mikrofon Perseverance merekam suara angin Mars untuk pertama kalinya.'],['Perseverance’s microphones recorded the sound of Martian wind for the first time.']],{img:'img/perseverance.jpg',cap:'NASA/JPL-Caltech/MSSS',refs:[nasa('/mars/','NASA · Mars'),wiki('Jezero_(crater)')]}),

 Pallas:I([['Jarak rata-rata','2,77 AU'],['Diameter','~513 km'],['Inklinasi','34,9°']],[['Average distance','2.77 AU'],['Diameter','~513 km'],['Inclination','34.9°']],
  'Asteroid kedua yang ditemukan (1802). Orbitnya sangat miring dibanding asteroid besar lain, sehingga sulit dikunjungi wahana.','The second asteroid discovered (1802). Its orbit is unusually tilted compared with other large asteroids, making it hard for spacecraft to reach.',
  ['Permukaannya dipenuhi kawah, kemungkinan karena orbitnya yang miring membuat tumbukan terjadi pada kecepatan lebih tinggi.'],['Its surface is heavily cratered, probably because its tilted orbit makes collisions happen at higher speeds.'],[wiki('2_Pallas')]),
 Hygiea:I([['Jarak rata-rata','3,15 AU'],['Diameter','~410 km']],[['Average distance','3.15 AU'],['Diameter','~410 km']],
  'Asteroid terbesar keempat. Pengamatan teleskop VLT pada 2019 menunjukkan bentuknya hampir bulat, sehingga ia kandidat planet kerdil.','The fourth-largest asteroid. Observations with the VLT in 2019 showed it is nearly round, making it a dwarf-planet candidate.',

 Psyche:I([['Jarak rata-rata','2,93 AU'],['Diameter','~222 km'],['Misi','Psyche (NASA, diluncurkan 2023)']],[['Average distance','2.93 AU'],['Diameter','~222 km'],['Mission','Psyche (NASA, launched 2023)']],
  'Asteroid yang kaya logam, mungkin inti besi-nikel dari planet kecil yang lapisan luarnya terkelupas oleh tabrakan. Wahana Psyche dijadwalkan tiba pada 2029.','A metal-rich asteroid, possibly the iron-nickel core of a small planet whose outer layers were stripped away by collisions. The Psyche spacecraft is scheduled to arrive in 2029.',

  'Asteroid dekat Bumi pertama yang ditemukan (1898). Pada 2001, wahana NEAR Shoemaker menjadi wahana pertama yang mendarat di asteroid, di permukaan Eros.','The first near-Earth asteroid discovered (1898). In 2001 the NEAR Shoemaker spacecraft became the first to land on an asteroid, on Eros.',

 Bennu:I([['Jarak rata-rata','1,13 AU'],['Diameter','~490 m'],['Sampel','OSIRIS-REx, tiba di Bumi 2023']],[['Average distance','1.13 AU'],['Diameter','~490 m'],['Sample','OSIRIS-REx, returned 2023']],
  'Asteroid kaya karbon yang sampelnya dibawa pulang wahana OSIRIS-REx pada September 2023. Di dalam sampel itu ditemukan asam amino dan mineral yang terbentuk dengan air.','A carbon-rich asteroid whose sample was brought back by OSIRIS-REx in September 2023. The sample contains amino acids and minerals formed in water.',
  ['Bennu tergolong asteroid berpotensi berbahaya, dengan peluang sekitar 1 banding 2.700 menabrak Bumi pada tahun 2182.','Permukaannya ternyata seperti kolam bola: lengan pengambil sampel OSIRIS-REx terbenam ke dalam bebatuan lepas.'],['Bennu is classified as potentially hazardous, with about a 1-in-2,700 chance of hitting Earth in 2182.','Its surface behaves like a ball pit: OSIRIS-REx’s sampling arm sank into the loose rubble.'],[nasa('/mission/osiris-rex/','NASA · OSIRIS-REx'),wiki('101955_Bennu')]),
 Ryugu:I([['Jarak rata-rata','1,19 AU'],['Diameter','~900 m'],['Sampel','Hayabusa2 (JAXA), 2020']],[['Average distance','1.19 AU'],['Diameter','~900 m'],['Sample','Hayabusa2 (JAXA), 2020']],
  'Asteroid berbentuk gasing yang dikunjungi wahana Jepang Hayabusa2. Wahana itu menembakkan proyektil untuk membuat kawah buatan, lalu membawa pulang sampel ke Bumi pada Desember 2020.','A spinning-top-shaped asteroid visited by Japan’s Hayabusa2, which fired a projectile to make an artificial crater and returned samples to Earth in December 2020.',
  ['Sampel Ryugu mengandung bahan organik dan ternyata termasuk materi paling purba di tata surya.'],['Ryugu samples contain organic material and turned out to be among the most primitive matter in the solar system.'],[wiki('162173_Ryugu')]),
 Eris:I([['Jarak rata-rata','67,9 AU'],['Diameter','~2.326 km'],['Satu tahun','~557 tahun'],['Bulan','Dysnomia']],[['Average distance','67.9 AU'],['Diameter','~2,326 km'],['Year','~557 years'],['Moon','Dysnomia']],
  'Planet kerdil paling masif yang diketahui, sedikit lebih masif dari Pluto. Penemuannya pada 2005 memicu perdebatan yang berujung pada definisi resmi "planet" oleh IAU tahun 2006, yang membuat Pluto menjadi planet kerdil.','The most massive known dwarf planet, slightly more massive than Pluto. Its discovery in 2005 sparked the debate that led to the IAU’s official definition of "planet" in 2006, which reclassified Pluto as a dwarf planet.',
  ['Saat ini Eris berada sekitar 96 AU dari Matahari, hampir di titik terjauh orbitnya.'],['Eris is currently about 96 AU from the Sun, near the farthest point of its orbit.'],[nasa('/dwarf-planets/eris/'),wiki('Eris_(dwarf_planet)')]),
 Makemake:I([['Jarak rata-rata','45,6 AU'],['Diameter','~1.430 km'],['Satu tahun','~306 tahun']],[['Average distance','45.6 AU'],['Diameter','~1,430 km'],['Year','~306 years']],
  'Planet kerdil di Sabuk Kuiper, ditemukan tak lama setelah Paskah 2005 sehingga dinamai menurut dewa pencipta dalam mitologi Rapa Nui (Pulau Paskah).','A Kuiper Belt dwarf planet, found shortly after Easter 2005 and so named after the creator god of Rapa Nui (Easter Island) mythology.',

 Haumea:I([['Jarak rata-rata','43,1 AU'],['Ukuran','~2.100 × 1.680 × 1.070 km'],['Satu hari','3,9 jam']],[['Average distance','43.1 AU'],['Size','~2,100 × 1,680 × 1,070 km'],['Day','3.9 hours']],
  'Planet kerdil yang berputar sangat cepat, sekali tiap 3,9 jam, sehingga bentuknya memanjang seperti telur pipih. Haumea juga punya cincin dan dua bulan.','A dwarf planet that spins extremely fast, once every 3.9 hours, stretching it into a flattened egg shape. Haumea also has a ring and two moons.',
  ['Cincinnya ditemukan pada 2017, saat Haumea melintas di depan sebuah bintang.'],['Its ring was discovered in 2017 when Haumea passed in front of a star.'],[nasa('/dwarf-planets/haumea/'),wiki('Haumea')]),
 Sedna:I([['Perihelion','~76 AU (tahun 2076)'],['Aphelion','~1.000 AU'],['Satu tahun','~11.000 tahun'],['Diameter','~1.000 km']],[['Perihelion','~76 AU (year 2076)'],['Aphelion','~1,000 AU'],['Year','~11,000 years'],['Diameter','~1,000 km']],
  'Salah satu benda terjauh yang orbitnya diketahui. Bahkan di titik terdekatnya, Sedna jauh melewati Neptunus, sehingga ia mungkin berasal dari tepi dalam Awan Oort.','One of the most distant objects with a known orbit. Even at its closest, Sedna stays far beyond Neptune, so it may come from the inner edge of the Oort Cloud.',
  ['Orbit lonjong Sedna sulit dijelaskan; salah satu hipotesisnya adalah tarikan bintang yang pernah lewat dekat Matahari muda.'],['Sedna’s elongated orbit is hard to explain; one idea is the pull of a star that passed close to the young Sun.'],[wiki('90377_Sedna')]),
 Quaoar:I([['Jarak rata-rata','43,2 AU'],['Diameter','~1.110 km']],[['Average distance','43.2 AU'],['Diameter','~1,110 km']],

  'Objek trans-Neptunus yang dinamai menurut dewa air dalam mitologi Tiongkok. Nama itu dipilih lewat pemungutan suara publik pada 2019.','A trans-Neptunian object named after a water god of Chinese mythology. The name was chosen by a public vote in 2019.',

  'Dijuluki "anti-Pluto": orbitnya mirip Pluto dan sama-sama beresonansi 2:3 dengan Neptunus, tapi Orcus selalu berada di sisi berlawanan Matahari dari Pluto.','Nicknamed the "anti-Pluto": its orbit resembles Pluto’s and shares the 2:3 resonance with Neptune, but Orcus is always on the opposite side of the Sun from Pluto.',

 Arrokoth:I([['Jarak rata-rata','44,1 AU'],['Ukuran','~36 km panjang'],['Dikunjungi','New Horizons, 1 Jan 2019']],[['Average distance','44.1 AU'],['Size','~36 km long'],['Visited by','New Horizons, Jan 1, 2019']],
  'Benda terjauh yang pernah dikunjungi wahana. Bentuknya seperti dua kue pipih yang menempel lembut, bukti bahwa planetesimal pertama terbentuk dengan cara yang tenang, bukan tabrakan keras.','The most distant object ever visited by a spacecraft. It looks like two flattened lobes gently stuck together, evidence that the first planetesimals formed calmly rather than by violent collisions.',

  ['Voyager 2 diluncurkan 16 hari sebelum Voyager 1, tapi Voyager 1 lebih cepat sehingga lebih dulu sampai ke Jupiter.'],['Voyager 2 launched 16 days before Voyager 1, but Voyager 1 was faster and reached Jupiter first.'],[nasa('/mission/voyager/voyager-2/')]),

 {id:{o:'Sepuluh pangkat tujuh meter. Inilah rumah kita.',r:'Sepuluh pangkat tujuh meter. Kita sudah pulang.',c:['Bumi: bola batu dan air selebar dua belas ribu tujuh ratus kilometer.','Atmosfer yang melindungi seluruh kehidupan, pada skala ini, setipis kulit apel.','Bumi berputar sekali sehari, sambil melaju sekitar tiga puluh kilometer per detik mengelilingi Matahari.']},
  en:{o:'Ten to the seventh metres. This is home.',r:'Ten to the seventh metres. We are home.',c:['Earth: a ball of rock and water about twelve thousand seven hundred kilometres across.','The atmosphere that shelters all life is, at this scale, as thin as the skin of an apple.','Earth spins once a day, while racing around the Sun at about thirty kilometres per second.']}},
 {id:{o:'Sepuluh pangkat sembilan meter.',r:'Sepuluh pangkat sembilan meter. Bulan menyambut kita.',c:['Bulan mengorbit rata-rata tiga ratus delapan puluh empat ribu kilometer dari Bumi.','Celah ini begitu lebar sehingga semua planet lain di tata surya hampir muat dijajarkan di dalamnya.','Cahaya menyeberanginya hanya dalam satu koma tiga detik.']},
  en:{o:'Ten to the ninth metres.',r:'Ten to the ninth metres. The Moon welcomes us.',c:['The Moon orbits an average of three hundred and eighty four thousand kilometres from Earth.','The gap is so wide that every other planet in the solar system could almost fit inside it, side by side.','Light crosses it in just one point three seconds.']}},
 {id:{o:'Sepuluh pangkat dua belas meter.',r:'Sepuluh pangkat dua belas meter. Kita kembali ke planet-planet berbatu.',c:['Inilah tata surya bagian dalam: Merkurius, Venus, Bumi, dan Mars.','Jarak Bumi ke Matahari, sekitar seratus lima puluh juta kilometer, disebut satu satuan astronomi.','Cahaya Matahari butuh delapan menit untuk sampai ke mata kita. Matahari yang kita lihat adalah Matahari delapan menit yang lalu.']},
  en:{o:'Ten to the twelfth metres.',r:'Ten to the twelfth metres. Back among the rocky planets.',c:['This is the inner solar system: Mercury, Venus, Earth and Mars.','The Earth to Sun distance, about one hundred and fifty million kilometres, is called one astronomical unit.','Sunlight takes eight minutes to reach our eyes. The Sun we see is the Sun of eight minutes ago.']}},
 {id:{o:'Sepuluh pangkat tiga belas meter.',r:'Sepuluh pangkat tiga belas meter. Planet-planet raksasa muncul kembali.',c:['Raksasa gas Jupiter dan Saturnus, lalu raksasa es Uranus dan Neptunus, mengorbit makin lambat makin jauh.','Neptunus butuh seratus enam puluh lima tahun untuk sekali mengelilingi Matahari.','Di luar Neptunus terbentang Sabuk Kuiper, rumah bagi Pluto dan ribuan dunia es kecil.']},
  en:{o:'Ten to the thirteenth metres.',r:'Ten to the thirteenth metres. The giant planets return.',c:['The gas giants Jupiter and Saturn, then the ice giants Uranus and Neptune, orbit ever more slowly the farther out they are.','Neptune needs one hundred and sixty five years to circle the Sun once.','Beyond Neptune lies the Kuiper Belt, home to Pluto and thousands of small icy worlds.']}},
 {id:{o:'Sepuluh pangkat empat belas meter.',r:'Sepuluh pangkat empat belas meter. Kita masuk kembali ke gelembung Matahari.',c:['Angin Matahari meniup gelembung raksasa bernama heliosfer.','Di tepinya, sekitar seratus dua puluh satuan astronomi, angin itu bertabrakan dengan gas antarbintang.','Voyager satu, diluncurkan tahun seribu sembilan ratus tujuh puluh tujuh, menembus batas ini pada dua ribu dua belas. Kini ia benda buatan manusia terjauh.']},
  en:{o:'Ten to the fourteenth metres.',r:'Ten to the fourteenth metres. We re-enter the Sun’s bubble.',c:['The solar wind blows a giant bubble called the heliosphere.','At its edge, about one hundred and twenty astronomical units out, that wind collides with interstellar gas.','Voyager One, launched in nineteen seventy seven, crossed this boundary in twenty twelve. It is now the most distant human-made object.']}},
 {id:{o:'Sepuluh pangkat tujuh belas meter.',r:'Sepuluh pangkat tujuh belas meter. Awan Oort menyelimuti kita.',c:['Seluruh orbit planet kini menyusut menjadi satu titik kecil.','Di sekelilingnya diduga ada Awan Oort: miliaran bongkahan es yang membentang lebih dari satu tahun cahaya.','Sesekali, salah satunya jatuh ke arah Matahari dan menjadi komet yang menghiasi langit kita.']},
  en:{o:'Ten to the seventeenth metres.',r:'Ten to the seventeenth metres. The Oort Cloud surrounds us.',c:['All the planetary orbits have shrunk to a single tiny dot.','Around it, we think, lies the Oort Cloud: billions of icy bodies stretching more than a light-year out.','Now and then one falls toward the Sun and becomes a comet in our sky.']}},
 {id:{o:'Sepuluh pangkat delapan belas meter.',r:'Sepuluh pangkat delapan belas meter. Bintang-bintang tetangga kembali terlihat.',c:['Kita kini berada di antara bintang-bintang tetangga.','Bintang terdekat, Proxima Centauri, berjarak empat koma dua tahun cahaya. Dengan wahana tercepat kita, perjalanan ke sana butuh puluhan ribu tahun.','Rasi bintang hanyalah pola dari sudut pandang Bumi. Bintang-bintangnya sebenarnya saling berjauhan.']},
  en:{o:'Ten to the eighteenth metres.',r:'Ten to the eighteenth metres. The neighbouring stars come back into view.',c:['We are now among the neighbouring stars.','The nearest, Proxima Centauri, is four point two light-years away. With our fastest spacecraft the trip would take tens of thousands of years.','Constellations are only patterns seen from Earth. Their stars are actually far apart from one another.']}},
 {id:{o:'Sepuluh pangkat dua puluh satu meter.',r:'Sepuluh pangkat dua puluh satu meter. Kita kembali ke galaksi kita.',c:['Galaksi Bima Sakti: piringan spiral selebar sekitar seratus ribu tahun cahaya, berisi ratusan miliar bintang.','Matahari hanyalah satu titik di salah satu lengan spiralnya, sekitar dua puluh enam ribu tahun cahaya dari pusat.','Di pusat galaksi bersembunyi lubang hitam raksasa bermassa empat juta kali Matahari.']},
  en:{o:'Ten to the twenty first metres.',r:'Ten to the twenty first metres. Back to our own galaxy.',c:['The Milky Way: a spiral disc about one hundred thousand light-years across, holding hundreds of billions of stars.','The Sun is a single point in one of its spiral arms, about twenty six thousand light-years from the centre.','At the centre hides a giant black hole four million times the mass of the Sun.']}},
 {id:{o:'Sepuluh pangkat dua puluh tiga meter.',r:'Sepuluh pangkat dua puluh tiga meter. Lingkungan galaksi kita.',c:['Bima Sakti punya tetangga: Grup Lokal, berisi lebih dari delapan puluh galaksi.','Yang terbesar adalah Andromeda, dua setengah juta tahun cahaya jauhnya, dan sedang bergerak mendekati kita.','Cahaya Andromeda yang kita lihat malam ini berangkat ketika manusia purba pertama baru muncul di Bumi.']},
  en:{o:'Ten to the twenty third metres.',r:'Ten to the twenty third metres. Our galactic neighbourhood.',c:['The Milky Way has neighbours: the Local Group, more than eighty galaxies.','The largest is Andromeda, two and a half million light-years away, and moving toward us.','The light from Andromeda we see tonight set out when the earliest humans were just appearing on Earth.']}},
 {id:{o:'Sepuluh pangkat dua puluh lima meter.',r:'Sepuluh pangkat dua puluh lima meter. Supergugus tempat kita tinggal.',c:['Grup Lokal hanyalah satu butir di Supergugus Laniakea, yang berarti langit tak terukur.','Sekitar seratus ribu galaksi di sini mengalir perlahan menuju satu titik tarikan bersama, Great Attractor.','Bentang Laniakea sekitar lima ratus dua puluh juta tahun cahaya.']},
  en:{o:'Ten to the twenty fifth metres.',r:'Ten to the twenty fifth metres. The supercluster we call home.',c:['The Local Group is a single grain in the Laniakea Supercluster, a name meaning immeasurable heaven.','About one hundred thousand galaxies here drift slowly toward a shared point of attraction, the Great Attractor.','Laniakea spans about five hundred and twenty million light-years.']}},
 {id:{o:'Sepuluh pangkat dua puluh tujuh meter.',r:'Sepuluh pangkat dua puluh tujuh meter.',c:['Inilah alam semesta teramati: jaring kosmik berisi ratusan miliar galaksi.','Filamen galaksi mengelilingi ruang hampa raksasa, seperti busa sabun.','Batasnya bukan dinding, melainkan batas waktu. Cahaya dari tempat yang lebih jauh belum sempat sampai kepada kita.']},
  en:{o:'Ten to the twenty seventh metres.',r:'Ten to the twenty seventh metres.',c:['This is the observable universe: a cosmic web of hundreds of billions of galaxies.','Filaments of galaxies wrap around vast empty voids, like soap foam.','Its edge is not a wall but a limit in time. Light from farther away has not yet had time to reach us.']}}
];
const T={
 id:{startO:'Selamat datang di Cosmic Ladder. Di setiap langkah, pandangan kita melebar sepuluh kali lipat.',startR:'Kita memulai dari tempat terjauh yang bisa kita lihat. Di setiap langkah, pandangan menyempit sepuluh kali lipat, sampai kita pulang ke Bumi.',
  endO:'Dan di suatu tempat di dalam jaring raksasa ini, ada satu titik biru pucat yang kita sebut rumah.',endR:'Dari tepi alam semesta teramati, kita kembali ke satu planet kecil yang kita sebut rumah. Terima kasih sudah ikut menjelajah.'},
 en:{startO:'Welcome to the Cosmic Ladder. With every step, our view grows ten times wider.',startR:'We begin at the farthest place we can see. With every step the view shrinks ten times, until we are home on Earth.',
  endO:'And somewhere inside this vast web is one pale blue dot we call home.',endR:'From the edge of the observable universe, we have come back to one small planet we call home. Thank you for exploring.'}
};

<script>
window.LEARN=(function(){
const X=(id,en)=>({id,en});
/* ---------- QUIZ: lv = level index (0..10), a = correct option index, go = where to fly after answering ---------- */
const QUIZ=[
 {lv:0,q:X('Bumi berotasi sekali kira-kira setiap…','Earth spins once on its axis roughly every…'),o:[X('1 jam','1 hour'),X('24 jam','24 hours'),X('7 hari','7 days'),X('365 hari','365 days')],a:1,
  e:X('Rotasi = berputar pada porosnya, menghasilkan siang dan malam. Tepatnya 23 jam 56 menit relatif terhadap bintang; 24 jam relatif terhadap Matahari. Revolusi (mengelilingi Matahari) yang butuh 365,25 hari.','Rotation means spinning on its own axis, which gives day and night. Precisely 23 h 56 min relative to the stars and 24 h relative to the Sun. Revolution, going around the Sun, takes 365.25 days.'),go:{s:7.3}},
 {lv:0,q:X('Apa penyebab utama musim di Bumi?','What mainly causes Earth’s seasons?'),o:[X('Bumi lebih dekat ke Matahari saat musim panas','Earth is closer to the Sun in summer'),X('Kemiringan poros Bumi 23,4°','Earth’s 23.4° axial tilt'),X('Matahari kadang lebih terang','The Sun sometimes shines brighter'),X('Bayangan Bulan','The Moon’s shadow')],a:1,
  e:X('Kemiringan poros membuat satu belahan Bumi menerima sinar lebih tegak dan siang lebih panjang. Buktinya: Bumi justru paling dekat ke Matahari sekitar 3 Januari, saat belahan utara sedang musim dingin.','The tilt makes one hemisphere receive steeper sunlight and longer days. Proof: Earth is actually closest to the Sun around 3 January, during northern winter.'),go:{s:7.3}},
 {lv:0,q:X('Massamu 60 kg. Di Bulan, massamu menjadi…','Your mass is 60 kg. On the Moon your mass becomes…'),o:[X('10 kg','10 kg'),X('Tetap 60 kg','Still 60 kg'),X('0 kg','0 kg'),X('360 kg','360 kg')],a:1,
  e:X('Massa = banyaknya materi, tidak berubah di mana pun. Yang berubah adalah berat (gaya gravitasi pada tubuhmu). Gravitasi Bulan ~0,165× Bumi, jadi timbangan menunjukkan ~10 kg, tapi massamu tetap 60 kg.','Mass is the amount of matter, and it is the same everywhere. What changes is weight, the gravitational force on your body. Lunar gravity is about 0.165× Earth’s, so a bathroom scale reads about 10 kg, yet your mass is still 60 kg.'),go:{id:'Bulan'}},
 {lv:1,q:X('Mengapa kita selalu melihat sisi Bulan yang sama?','Why do we always see the same side of the Moon?'),o:[X('Bulan tidak berotasi','The Moon does not rotate'),X('Bulan berotasi tepat sekali setiap satu kali mengorbit Bumi','The Moon rotates exactly once per orbit'),X('Bulan berotasi sekali sehari','The Moon rotates once a day'),X('Bumi menutupi sisi lainnya','Earth blocks the other side')],a:1,
  e:X('Namanya penguncian pasang surut (tidal locking). Gravitasi Bumi selama miliaran tahun memperlambat rotasi Bulan sampai periode rotasinya = periode orbitnya (27,3 hari).','This is tidal locking. Over billions of years Earth’s gravity slowed the Moon’s spin until its rotation period equalled its orbital period (27.3 days).'),go:{s:9.1}},
 {lv:1,q:X('Berapa lama cahaya menempuh jarak Bumi ke Bulan?','How long does light take to travel from Earth to the Moon?'),o:[X('~1,3 detik','~1.3 seconds'),X('~8 menit','~8 minutes'),X('~1 jam','~1 hour'),X('~1 hari','~1 day')],a:0,
  e:X('Jarak rata-rata 384.400 km ÷ 299.792 km/detik ≈ 1,28 detik. Jadi saat menatap Bulan, kamu melihatnya sebagaimana 1,3 detik yang lalu.','An average 384,400 km ÷ 299,792 km/s ≈ 1.28 s. When you look at the Moon, you see it as it was 1.3 seconds ago.'),go:{s:9.1}},
 {lv:2,q:X('Satu Satuan Astronomi (AU) adalah…','One astronomical unit (AU) is…'),o:[X('Jarak yang ditempuh cahaya dalam setahun','The distance light travels in a year'),X('Jarak rata-rata Bumi–Matahari, ~150 juta km','The average Earth–Sun distance, ~150 million km'),X('Jarak Bumi–Bulan','The Earth–Moon distance'),X('Diameter tata surya','The diameter of the solar system')],a:1,
  e:X('1 AU = 149.597.870,7 km (ditetapkan IAU tahun 2012). Cahaya menempuhnya dalam ~8 menit 19 detik.','1 AU = 149,597,870.7 km, fixed by the IAU in 2012. Light covers it in about 8 min 19 s.'),go:{s:11.85}},
 {lv:2,q:X('Mengapa Venus lebih panas daripada Merkurius, padahal lebih jauh dari Matahari?','Why is Venus hotter than Mercury even though it is farther from the Sun?'),o:[X('Venus punya inti lebih panas','Venus has a hotter core'),X('Atmosfer CO₂ yang sangat tebal memerangkap panas (efek rumah kaca)','Its very thick CO₂ atmosphere traps heat (greenhouse effect)'),X('Venus berotasi lebih cepat','Venus spins faster'),X('Venus memantulkan lebih sedikit cahaya','Venus reflects less light')],a:1,
  e:X('Tekanan atmosfer Venus ~92× Bumi dan 96% CO₂. Panas masuk tapi sulit keluar, jadi permukaannya ~465 °C siang dan malam. Merkurius tidak punya atmosfer berarti, jadi sisi malamnya membeku hingga −180 °C.','Venus’s atmosphere is ~92× Earth’s pressure and 96% CO₂. Heat gets in but can’t escape, so the surface sits at ~465 °C day and night. Mercury has almost no atmosphere, so its night side freezes to −180 °C.'),go:{id:'Venus'}},
 {lv:2,q:X('Sabuk asteroid utama terletak di antara…','The main asteroid belt lies between…'),o:[X('Bumi dan Mars','Earth and Mars'),X('Mars dan Jupiter','Mars and Jupiter'),X('Jupiter dan Saturnus','Jupiter and Saturn'),X('Neptunus dan Pluto','Neptune and Pluto')],a:1,
  e:X('Sekitar 2,1–3,3 AU. Gravitasi Jupiter mencegah batuan di sana bergabung menjadi planet. Total massanya hanya ~3% massa Bulan, dan Ceres sendiri menyumbang sekitar sepertiganya.','About 2.1–3.3 AU. Jupiter’s gravity kept that material from forming a planet. Its total mass is only ~3% of the Moon’s, and Ceres alone holds about a third of it.'),go:{s:12.2}},
 {lv:3,q:X('Planet mana yang memiliki satelit alami terbanyak yang diketahui?','Which planet has the most known natural moons?'),o:[X('Jupiter','Jupiter'),X('Saturnus','Saturn'),X('Uranus','Uranus'),X('Neptunus','Neptune')],a:1,
  e:X('Saturnus memimpin jauh: ratusan bulan, kebanyakan bulan kecil "irregular" yang dulunya pecahan tabrakan dan tertangkap gravitasinya. Buka Saturnus di simulasi untuk melihat kawanan bulannya.','Saturn leads by far with hundreds of moons, most of them small "irregular" moons that are collision fragments captured by its gravity. Open Saturn in the simulation to see the swarm.'),go:{id:'Saturnus'}},
 {lv:3,q:X('Mengapa Pluto diklasifikasikan ulang menjadi planet katai pada 2006?','Why was Pluto reclassified as a dwarf planet in 2006?'),o:[X('Ukurannya ternyata menyusut','It turned out to be shrinking'),X('Belum "membersihkan" lingkungan orbitnya dari benda lain','It has not "cleared" its orbital neighbourhood'),X('Tidak mengelilingi Matahari','It does not orbit the Sun'),X('Tidak berbentuk bulat','It is not round')],a:1,
  e:X('Definisi IAU: planet harus (1) mengorbit Matahari, (2) cukup masif hingga bulat, (3) mendominasi orbitnya. Pluto lolos dua syarat pertama, tapi berbagi orbit dengan ribuan objek Sabuk Kuiper.','The IAU definition says a planet must (1) orbit the Sun, (2) be massive enough to be round, and (3) dominate its orbit. Pluto passes the first two but shares its zone with thousands of Kuiper Belt objects.'),go:{id:'Pluto'}},
 {lv:3,q:X('Cincin Saturnus sebagian besar terbuat dari…','Saturn’s rings are made mostly of…'),o:[X('Gas','Gas'),X('Es air','Water ice'),X('Besi','Iron'),X('Debu Matahari','Solar dust')],a:1,
  e:X('Lebih dari 95% es air, dari butiran debu sampai bongkahan sebesar rumah. Lebarnya ~280.000 km, tapi tebalnya umumnya hanya ~10 meter, lebih tipis daripada kertas jika diskalakan.','Over 95% water ice, from dust grains to house-sized chunks. About 280,000 km wide but typically only ~10 m thick, thinner than paper at scale.'),go:{id:'Saturnus'}},
 {lv:4,q:X('Sinyal radio dari Voyager 1 (tahun 2026) butuh waktu berapa lama untuk mencapai Bumi?','In 2026, how long does a radio signal from Voyager 1 take to reach Earth?'),o:[X('~23 menit','~23 minutes'),X('Hampir 1 hari (~23 jam)','Almost a day (~23 hours)'),X('~1 bulan','~1 month'),X('~1 tahun','~1 year')],a:1,
  e:X('Voyager 1 berada sekitar 170 AU (~25 miliar km). Diperkirakan sekitar akhir 2026 jaraknya mencapai 1 hari-cahaya, sehingga satu tanya-jawab dengan wahana ini makan waktu ~2 hari.','Voyager 1 is about 170 AU (~25 billion km) away. Around late 2026 it is expected to reach one light-day, so one command-and-reply round trip takes about 2 days.'),go:{id:'Voyager 1'}},
 {lv:4,q:X('Heliopause adalah…','The heliopause is…'),o:[X('Permukaan Matahari','The Sun’s surface'),X('Batas tempat angin Matahari bertemu medium antarbintang','Where the solar wind meets the interstellar medium'),X('Orbit Neptunus','Neptune’s orbit'),X('Tepi luar Awan Oort','The outer edge of the Oort Cloud')],a:1,
  e:X('Voyager 1 melewatinya pada Agustus 2012 di ~121 AU, Voyager 2 pada November 2018 di ~119 AU. Di luar heliopause, partikel di sekitar wahana sebagian besar berasal dari bintang lain.','Voyager 1 crossed it in August 2012 at ~121 AU, and Voyager 2 in November 2018 at ~119 AU. Beyond it, most particles around the craft come from other stars.'),go:{s:13.9}},
 {lv:5,q:X('Awan Oort adalah…','The Oort Cloud is…'),o:[X('Nebula tempat Matahari lahir','The nebula where the Sun was born'),X('Bola raksasa benda es yang diduga menyelimuti tata surya, asal komet periode panjang','A vast sphere of icy bodies thought to surround the solar system, home of long-period comets'),X('Awan gas di atmosfer Jupiter','A gas cloud in Jupiter’s atmosphere'),X('Sabuk asteroid kedua','A second asteroid belt')],a:1,
  e:X('Belum pernah teramati langsung. Keberadaannya disimpulkan dari orbit komet periode panjang yang datang dari segala arah. Perkiraannya membentang dari ~2.000 hingga ~100.000 AU.','It has never been seen directly. It is inferred from long-period comets arriving from every direction, and is estimated to span ~2,000 to ~100,000 AU.'),go:{s:16.55}},
 {lv:6,q:X('Tahun cahaya adalah satuan…','A light-year is a unit of…'),o:[X('Waktu','Time'),X('Jarak','Distance'),X('Kecepatan','Speed'),X('Kecerahan','Brightness')],a:1,
  e:X('Jarak yang ditempuh cahaya dalam satu tahun: ~9,46 triliun km. Namanya memang mengecoh karena ada kata "tahun".','The distance light travels in one year, ~9.46 trillion km. The word "year" makes the name misleading.'),go:{s:18}},
 {lv:6,q:X('Bintang terdekat dari Matahari adalah…','The nearest star to the Sun is…'),o:[X('Sirius','Sirius'),X('Proxima Centauri','Proxima Centauri'),X('Betelgeuse','Betelgeuse'),X('Polaris','Polaris')],a:1,
  e:X('Proxima Centauri, katai merah ~4,24 tahun cahaya. Dengan kecepatan Voyager 1 (~17 km/detik), perjalanannya butuh ~75.000 tahun.','Proxima Centauri, a red dwarf about 4.24 light-years away. At Voyager 1’s speed (~17 km/s) the trip would take ~75,000 years.'),go:{id:'Proxima Centauri'}},
 {lv:6,q:X('Katai putih adalah…','A white dwarf is…'),o:[X('Bintang yang baru lahir','A newborn star'),X('Inti sisa bintang mirip Matahari setelah bahan bakarnya habis','The leftover core of a Sun-like star after its fuel runs out'),X('Planet yang sangat panas','A very hot planet'),X('Lubang hitam kecil','A small black hole')],a:1,
  e:X('Seukuran Bumi tapi bermassa ~setengah Matahari. Satu sendok teh materinya berbobot beberapa ton. Sekitar 5 miliar tahun lagi, Matahari juga akan menjadi katai putih.','Earth-sized yet about half a solar mass; a teaspoon of it weighs several tonnes. In about 5 billion years the Sun will become one too.'),go:{id:'Sirius'}},
 {lv:7,q:X('Matahari mengelilingi pusat Bima Sakti sekali setiap…','The Sun orbits the centre of the Milky Way once every…'),o:[X('1 tahun','1 year'),X('~230 juta tahun','~230 million years'),X('13,8 miliar tahun','13.8 billion years'),X('~1.000 tahun','~1,000 years')],a:1,
  e:X('Disebut "tahun galaksi". Kecepatan Matahari ~230 km/detik. Terakhir kali Matahari berada di posisi ini, dinosaurus pertama baru muncul.','This is a "galactic year", at about 230 km/s. The last time the Sun was here, the first dinosaurs were just appearing.'),go:{s:21.2}},
 {lv:7,q:X('Apa yang ada di pusat Bima Sakti?','What sits at the centre of the Milky Way?'),o:[X('Bintang raksasa','A giant star'),X('Lubang hitam supermasif Sagittarius A*','The supermassive black hole Sagittarius A*'),X('Matahari','The Sun'),X('Ruang kosong','Empty space')],a:1,
  e:X('Massanya ~4 juta kali Matahari. Andrea Ghez dan Reinhard Genzel meraih Nobel Fisika 2020 dengan melacak bintang-bintang yang mengorbitnya. Event Horizon Telescope memotret bayangannya pada 2022.','About 4 million solar masses. Andrea Ghez and Reinhard Genzel won the 2020 Nobel Prize in Physics by tracking stars orbiting it, and the Event Horizon Telescope imaged its shadow in 2022.'),go:{id:'Pusat galaksi'}},
 {lv:7,q:X('Lubang hitam adalah daerah di mana…','A black hole is a region where…'),o:[X('Tidak ada gravitasi','There is no gravity'),X('Kecepatan lepasnya melebihi kecepatan cahaya','The escape velocity exceeds the speed of light'),X('Semua bintang mati','All stars are dead'),X('Ruang benar-benar kosong','Space is completely empty')],a:1,
  e:X('Di dalam cakrawala peristiwa, bahkan cahaya tidak bisa keluar. Dari kejauhan, gravitasinya sama seperti benda lain bermassa sama. Lubang hitam tidak "menyedot" semua yang ada di sekitarnya.','Inside the event horizon not even light can escape. From far away its gravity is the same as any object of equal mass, so black holes do not "suck in" everything nearby.'),go:{id:'Pusat galaksi'}},
 {lv:8,q:X('Saat melihat Galaksi Andromeda, kamu melihat cahaya yang berangkat…','When you look at the Andromeda Galaxy, you see light that left it…'),o:[X('Tadi malam','Last night'),X('~2,5 juta tahun lalu','~2.5 million years ago'),X('~2.500 tahun lalu','~2,500 years ago'),X('Saat Big Bang','At the Big Bang')],a:1,
  e:X('Jaraknya ~2,5 juta tahun cahaya. Cahaya itu berangkat ketika nenek moyang manusia paling awal (genus Homo) baru muncul di Afrika. Melihat jauh = melihat ke masa lalu.','It is ~2.5 million light-years away. That light set out when the earliest humans (genus Homo) were appearing in Africa. Looking far means looking back in time.'),go:{id:'Andromeda'}},
 {lv:8,q:X('Bagaimana gerak Bima Sakti dan Andromeda saat ini?','How are the Milky Way and Andromeda moving relative to each other?'),o:[X('Menjauh dengan cepat','Rushing apart'),X('Saling mendekat ~110 km/detik','Approaching at ~110 km/s'),X('Diam relatif satu sama lain','At rest relative to each other'),X('Sudah menyatu','Already merged')],a:1,
  e:X('Andromeda adalah salah satu dari sedikit galaksi yang bergerak mendekati kita (blueshift). Studi 2025 memperkirakan peluang tabrakan dalam 10 miliar tahun ke depan sekitar 50%, jadi belum pasti.','Andromeda is one of the few galaxies moving toward us (blueshift). A 2025 study puts the chance of a merger within the next 10 billion years at about 50%, so it is not certain.'),go:{id:'Andromeda'}},
 {lv:9,q:X('"Laniakea" (nama supergugus kita) berasal dari bahasa Hawaii yang berarti…','"Laniakea", the name of our supercluster, is Hawaiian for…'),o:[X('Pulau bintang','Island of stars'),X('Langit yang tak terukur','Immeasurable heaven'),X('Rumah besar','Great home'),X('Lautan cahaya','Ocean of light')],a:1,
  e:X('Didefinisikan tahun 2014 oleh R. Brent Tully dkk. berdasarkan arah aliran gerak ~100.000 galaksi. Diameternya ~520 juta tahun cahaya.','Defined in 2014 by R. Brent Tully and colleagues from the flow of about 100,000 galaxies. It is roughly 520 million light-years across.'),go:{s:24.9}},
 {lv:9,q:X('Pergeseran merah (redshift) galaksi jauh menunjukkan bahwa…','The redshift of distant galaxies shows that…'),o:[X('Galaksi itu berwarna merah','Those galaxies are red'),X('Alam semesta mengembang','The universe is expanding'),X('Galaksi itu sangat panas','Those galaxies are very hot'),X('Cahaya melambat','Light slows down')],a:1,
  e:X('Hubble (1929) menemukan bahwa makin jauh galaksi, makin besar pergeseran merahnya. Ruang itu sendiri merenggang dan "meregangkan" gelombang cahaya ke arah merah.','Hubble found in 1929 that the farther a galaxy is, the larger its redshift. Space itself stretches and pulls light waves toward the red.'),go:{s:24.9}},
 {lv:10,q:X('Alam semesta berusia 13,8 miliar tahun, tapi radius alam semesta teramati ~46,5 miliar tahun cahaya. Mengapa?','The universe is 13.8 billion years old, yet the observable universe is ~46.5 billion light-years in radius. Why?'),o:[X('Cahaya pernah lebih cepat','Light used to be faster'),X('Ruang terus mengembang selama cahaya dalam perjalanan','Space kept expanding while the light was travelling'),X('Pengukurannya salah','The measurement is wrong'),X('Bumi bergerak sangat cepat','Earth moves very fast')],a:1,
  e:X('Objek yang cahayanya berangkat 13,8 miliar tahun lalu kini sudah terbawa pengembangan ruang hingga ~46 miliar tahun cahaya dari kita. Tidak ada yang bergerak melebihi cahaya; ruangnya yang meregang.','Objects whose light left 13.8 billion years ago have since been carried by expanding space to ~46 billion light-years away. Nothing outran light; space itself stretched.'),go:{s:27}},
 {lv:10,q:X('Radiasi latar belakang kosmik (CMB) adalah…','The cosmic microwave background (CMB) is…'),o:[X('Cahaya dari bintang pertama','Light from the first stars'),X('Cahaya sisa sekitar 380.000 tahun setelah Big Bang','Leftover light from about 380,000 years after the Big Bang'),X('Gelombang radio dari Matahari','Radio waves from the Sun'),X('Pantulan cahaya galaksi','Reflected galaxy light')],a:1,
  e:X('Saat itu alam semesta cukup dingin (~3.000 K) sehingga atom terbentuk dan cahaya bisa bebas melintas. Pengembangan ruang meregangkannya menjadi gelombang mikro bersuhu 2,725 K. Sebagian "semut" di TV analog lama berasal dari CMB.','By then the universe had cooled to ~3,000 K, atoms formed, and light could travel freely. Expansion stretched it into microwaves at 2.725 K. Part of the "snow" on old analogue TVs came from the CMB.'),go:{s:27}},
 {lv:10,q:X('Dari 10⁷ m ke 10⁹ m, lebar pandangan menjadi berapa kali lipat?','Going from 10⁷ m to 10⁹ m, how many times wider does the view get?'),o:[X('2 kali','2×'),X('20 kali','20×'),X('100 kali','100×'),X('1.000 kali','1,000×')],a:2,
  e:X('Setiap kenaikan 1 pada pangkat berarti ×10. Naik 2 pangkat berarti 10 × 10 = 100. Inilah kekuatan notasi ilmiah: seluruh alam semesta muat dalam ~20 anak tangga.','Each +1 in the exponent means ×10, so +2 means 10 × 10 = 100. That is the power of scientific notation: the whole universe fits in about 20 steps.'),go:{s:9.1}}
];
/* ---------- GLOSSARY ---------- */
const GLOSS=[
 {k:'pow',t:X('Pangkat sepuluh (notasi ilmiah)','Powers of ten (scientific notation)'),d:X('Cara menulis angka sangat besar atau kecil: 10³ = 1.000, 10⁶ = 1 juta. Angka di layar kiri atas (10^s meter) memberi tahu lebar pandanganmu. Naik 1 berarti 10× lebih luas.','A way to write huge or tiny numbers: 10³ = 1,000 and 10⁶ = 1 million. The big number at top left (10^s metres) is the width of your view, and each +1 means 10× wider.'),ex:X('Bumi ~10⁷ m, tata surya ~10¹³ m, alam semesta teramati ~10²⁷ m.','Earth ~10⁷ m, solar system ~10¹³ m, observable universe ~10²⁷ m.'),go:{s:9.1}},
 {k:'rot',t:X('Rotasi vs revolusi','Rotation vs revolution'),d:X('Rotasi = berputar pada poros sendiri, seperti gasing. Revolusi = bergerak mengelilingi benda lain, seperti pelari di lintasan. Bumi berotasi ~24 jam (siang–malam) dan berevolusi 365,25 hari (satu tahun).','Rotation is spinning on your own axis, like a top. Revolution is moving around another body, like a runner on a track. Earth rotates in ~24 h (day and night) and revolves in 365.25 days (a year).'),ex:X('Percepat waktu di panel kanan untuk melihat keduanya sekaligus.','Speed up time in the right panel to watch both at once.'),go:{s:9.1}},
 {k:'grav',t:X('Gravitasi & orbit','Gravity & orbits'),d:X('Gravitasi adalah tarikan antarbenda bermassa. Orbit terjadi ketika benda bergerak menyamping cukup cepat sehingga terus "jatuh" tapi selalu meleset dari permukaan. ISS jatuh ke Bumi terus-menerus dengan ~7,7 km/detik!','Gravity is the pull between masses. An orbit happens when something moves sideways fast enough that it keeps "falling" but always misses the ground. The ISS is in constant free fall at ~7.7 km/s!'),ex:X('Astronaut di ISS melayang bukan karena tanpa gravitasi (masih ~90%), tapi karena ikut jatuh bersama stasiunnya.','ISS astronauts float not because gravity is gone (it is still ~90%) but because they fall together with the station.'),go:{id:'ISS'}},
 {k:'kep',t:X('Hukum Kepler','Kepler’s laws'),d:X('(1) Orbit planet berbentuk elips dengan Matahari di salah satu titik fokusnya. (2) Planet bergerak lebih cepat saat dekat Matahari. (3) Makin jauh planet, makin lama tahunnya: T² ∝ a³.','(1) Planetary orbits are ellipses with the Sun at one focus. (2) Planets move faster when closer to the Sun. (3) The farther the planet, the longer its year: T² ∝ a³.'),ex:X('Simulasi ini menghitung posisi planet langsung dari persamaan Kepler.','This simulation computes planet positions directly from Kepler’s equation.'),go:{s:12.6}},
 {k:'au',t:X('Satuan Astronomi (AU)','Astronomical unit (AU)'),d:X('Jarak rata-rata Bumi–Matahari: 149.597.870,7 km. Dipakai untuk jarak di dalam tata surya karena kilometer terlalu kecil.','The average Earth–Sun distance: 149,597,870.7 km. Used inside the solar system because kilometres are too small to be handy.'),ex:X('Jupiter ~5,2 AU, Neptunus ~30 AU, Voyager 1 ~170 AU.','Jupiter ~5.2 AU, Neptune ~30 AU, Voyager 1 ~170 AU.'),go:{s:11.85}},
 {k:'ly',t:X('Tahun cahaya','Light-year'),d:X('Jarak yang ditempuh cahaya (299.792 km/detik) dalam satu tahun: ~9,46 triliun km ≈ 63.241 AU. Ini satuan jarak, bukan waktu.','The distance light (299,792 km/s) travels in one year: ~9.46 trillion km ≈ 63,241 AU. It is a distance, not a time.'),ex:X('Proxima Centauri 4,24 tahun cahaya; pusat galaksi ~26.700 tahun cahaya.','Proxima Centauri 4.24 ly; galactic centre ~26,700 ly.'),go:{s:18}},
 {k:'pc',t:X('Parsec','Parsec'),d:X('Satuan jarak para astronom: 1 parsec ≈ 3,26 tahun cahaya. Asalnya dari "paralaks satu detik busur": jarak di mana bintang tampak bergeser 1/3600 derajat saat Bumi pindah 1 AU.','The astronomer’s distance unit: 1 parsec ≈ 3.26 light-years. It comes from "parallax of one arcsecond", the distance at which a star shifts by 1/3600 degree as Earth moves 1 AU.'),ex:X('Tidak ada bintang yang sejauh 1 parsec dari kita; Proxima ~1,30 parsec.','No star is as close as 1 parsec; Proxima is ~1.30 pc.'),go:{s:18}},
 {k:'lt',t:X('Waktu tempuh cahaya','Light-travel time'),d:X('Cahaya butuh waktu untuk sampai ke mata kita, jadi kita selalu melihat masa lalu: Matahari 8 menit lalu, Andromeda 2,5 juta tahun lalu. Teleskop adalah mesin waktu.','Light takes time to reach us, so we always see the past: the Sun as it was 8 minutes ago, Andromeda 2.5 million years ago. Telescopes are time machines.'),ex:X('Gunakan alat ukur (ikon penggaris) untuk melihat waktu tempuh cahaya antar planet.','Use the measuring tool (ruler icon) to see light-travel time between planets.'),go:{s:11.85}},
 {k:'tidal',t:X('Penguncian pasang surut','Tidal locking'),d:X('Ketika gravitasi menyamakan periode rotasi suatu benda dengan periode orbitnya, sehingga sisi yang sama selalu menghadap benda induk. Sebagian besar bulan besar di tata surya terkunci begini.','When gravity matches a body’s spin period to its orbital period, so the same side always faces its parent. Most large moons in the solar system are locked this way.'),ex:X('Bulan, Io, Europa, dan Titan semuanya terkunci pasang surut.','The Moon, Io, Europa and Titan are all tidally locked.'),go:{s:9.1}},
 {k:'lag',t:X('Titik Lagrange','Lagrange points'),d:X('Lima titik di sekitar dua benda besar (mis. Matahari–Bumi) tempat gravitasi keduanya dan gerak orbit seimbang, sehingga wahana bisa "parkir" dengan sedikit bahan bakar.','Five spots around two large bodies (e.g. Sun–Earth) where their gravity and orbital motion balance, so a spacecraft can "park" with little fuel.'),ex:X('JWST mengorbit di sekitar L2, ~1,5 juta km dari Bumi, selalu membelakangi Matahari, Bumi, dan Bulan.','JWST orbits around L2, ~1.5 million km from Earth, keeping the Sun, Earth and Moon behind its sunshield.'),go:{id:'JWST'}},
 {k:'dwarf',t:X('Planet katai','Dwarf planet'),d:X('Benda yang mengorbit Matahari dan cukup masif untuk bulat, tapi belum membersihkan orbitnya. Ada lima yang diakui IAU: Ceres, Pluto, Eris, Haumea, Makemake.','A body that orbits the Sun and is massive enough to be round but has not cleared its orbit. The IAU recognises five: Ceres, Pluto, Eris, Haumea and Makemake.'),ex:X('Haumea berotasi sangat cepat (~4 jam) sampai bentuknya lonjong seperti bola rugby.','Haumea spins so fast (~4 h) that it is stretched like a rugby ball.'),go:{id:'Pluto'}},
 {k:'kuiper',t:X('Sabuk Kuiper','Kuiper Belt'),d:X('Cakram benda es di luar Neptunus, ~30–50 AU. Rumah bagi Pluto, Arrokoth, dan komet periode pendek. Mirip sabuk asteroid, tapi ~20× lebih lebar dan jauh lebih masif.','A disc of icy bodies beyond Neptune, ~30–50 AU, home to Pluto, Arrokoth and short-period comets. Like the asteroid belt, but ~20× wider and far more massive.'),ex:X('New Horizons terbang melewati Arrokoth pada 1 Januari 2019, objek terjauh yang pernah dikunjungi.','New Horizons flew past Arrokoth on 1 January 2019, the most distant object ever visited.'),go:{id:'Sabuk Kuiper'}},
 {k:'helio',t:X('Heliosfer','Heliosphere'),d:X('"Gelembung" raksasa yang ditiup angin Matahari di sekitar tata surya. Batas luarnya, heliopause, berada ~120 AU, tempat angin Matahari bertemu gas antarbintang.','The giant bubble blown by the solar wind around the solar system. Its outer edge, the heliopause, lies ~120 AU out where the solar wind meets interstellar gas.'),ex:X('Kedua Voyager kini sudah berada di luar heliopause.','Both Voyagers are now beyond the heliopause.'),go:{s:13.9}},
 {k:'oort',t:X('Awan Oort','Oort Cloud'),d:X('Kulit bola hipotetis berisi miliaran–triliunan benda es, ~2.000–100.000 AU dari Matahari. Diusulkan Jan Oort (1950) untuk menjelaskan komet yang datang dari segala arah.','A hypothetical spherical shell of billions to trillions of icy bodies, ~2,000–100,000 AU from the Sun. Proposed by Jan Oort in 1950 to explain comets arriving from every direction.'),ex:X('Voyager 1 butuh ~300 tahun untuk mencapai tepi dalamnya.','Voyager 1 will need ~300 years to reach its inner edge.'),go:{s:16.55}},
 {k:'exo',t:X('Eksoplanet','Exoplanet'),d:X('Planet yang mengorbit bintang selain Matahari. Lebih dari 6.000 sudah terkonfirmasi. Cara paling produktif menemukannya: metode transit, yaitu mengukur bintang yang meredup sedikit saat planet lewat di depannya.','A planet orbiting a star other than the Sun. Over 6,000 are confirmed. The most productive way to find them is the transit method: measuring a star’s slight dimming as a planet passes in front.'),ex:X('Proxima b mengorbit di zona layak huni bintang terdekat kita.','Proxima b orbits in the habitable zone of our nearest star.'),go:{id:'Proxima Centauri'}},
 {k:'neb',t:X('Nebula','Nebula'),d:X('Awan gas dan debu antarbintang. Ada yang menjadi "pabrik bintang" (seperti Nebula Orion), ada yang merupakan sisa bintang mati (nebula planeter, sisa supernova).','A cloud of interstellar gas and dust. Some are star factories, like the Orion Nebula; others are remains of dead stars (planetary nebulae, supernova remnants).'),ex:X('Aktifkan lapisan "Nebula" di panel kanan untuk melihat posisinya di langit.','Turn on the "Nebulae" layer in the right panel to see where they sit in the sky.'),go:{s:18}},
 {k:'wd',t:X('Katai putih','White dwarf'),d:X('Inti sisa bintang bermassa rendah–sedang setelah lapisan luarnya terlepas. Seukuran Bumi, massanya ~0,6 Matahari, dan mendingin perlahan selama miliaran tahun.','The exposed core of a low-to-medium-mass star after its outer layers drift away. Earth-sized, ~0.6 solar masses, cooling slowly over billions of years.'),ex:X('Sirius B, pasangan Sirius, adalah katai putih terdekat yang terkenal.','Sirius B, the companion of Sirius, is the famous nearby white dwarf.'),go:{id:'Sirius'}},
 {k:'ns',t:X('Bintang neutron','Neutron star'),d:X('Inti runtuh bintang masif setelah supernova. Diameternya ~20 km tapi massanya 1,4–2 Matahari. Satu sendok teh materinya ~1 miliar ton. Yang berputar dan memancarkan berkas radio disebut pulsar.','The collapsed core of a massive star after a supernova: ~20 km across but 1.4–2 solar masses. A teaspoon weighs ~1 billion tonnes. Spinning ones that sweep radio beams are pulsars.'),ex:X('Pulsar Kepiting berputar ~30 kali per detik.','The Crab Pulsar spins about 30 times a second.'),go:{s:18}},
 {k:'bh',t:X('Lubang hitam','Black hole'),d:X('Daerah dengan gravitasi begitu kuat sehingga kecepatan lepasnya melebihi kecepatan cahaya. Batasnya disebut cakrawala peristiwa. Ada yang seukuran bintang (sisa supernova) dan ada yang supermasif di pusat galaksi.','A region where gravity is so strong that the escape velocity exceeds light speed. Its boundary is the event horizon. Some are stellar-mass (from supernovae); supermassive ones sit in galaxy centres.'),ex:X('Sagittarius A* di pusat galaksi kita: ~4 juta massa Matahari.','Sagittarius A* at our galaxy’s centre: ~4 million solar masses.'),go:{id:'Pusat galaksi'}},
 {k:'gal',t:X('Galaksi','Galaxy'),d:X('Kumpulan ratusan juta hingga triliunan bintang, gas, debu, dan materi gelap yang terikat gravitasi. Bentuknya bisa spiral, elips, atau tak beraturan.','A gravitationally bound system of hundreds of millions to trillions of stars, plus gas, dust and dark matter. Shapes can be spiral, elliptical or irregular.'),ex:X('Bima Sakti: spiral berpalang, ~100.000 tahun cahaya, 100–400 miliar bintang.','The Milky Way is a barred spiral, ~100,000 ly across, with 100–400 billion stars.'),go:{s:21.2}},
 {k:'dm',t:X('Materi gelap','Dark matter'),d:X('Materi tak terlihat yang hanya terdeteksi lewat gravitasinya. Tanpanya, bintang di tepi galaksi berputar terlalu cepat sehingga galaksi akan terlempar berantakan. Menyusun ~27% isi alam semesta; materi biasa hanya ~5%.','Invisible matter detected only through its gravity. Without it, stars at galaxy edges orbit so fast that galaxies would fly apart. It makes up ~27% of the universe; ordinary matter is only ~5%.'),ex:X('Mode "Rotasi diferensial" di skala galaksi menunjukkan bintang dalam vs luar berputar dengan laju berbeda.','The "Differential rotation" mode at galaxy scale shows inner and outer stars orbiting at different rates.'),go:{s:21.2}},
 {k:'de',t:X('Energi gelap','Dark energy'),d:X('Penyebab pengembangan alam semesta yang makin cepat, ditemukan 1998 (Nobel Fisika 2011). Menyusun ~68% isi alam semesta, tapi sifatnya masih misteri terbesar kosmologi.','Whatever drives the universe’s accelerating expansion, discovered in 1998 (2011 Nobel Prize in Physics). It is ~68% of the universe, and its nature is cosmology’s biggest mystery.'),ex:X('Data DESI 2024–2025 mengisyaratkan energi gelap mungkin berubah seiring waktu, tapi belum pasti.','DESI data from 2024–2025 hint that dark energy may change over time, but this is not settled.'),go:{s:27}},
 {k:'rs',t:X('Pergeseran merah (redshift)','Redshift'),d:X('Cahaya dari benda yang menjauh atau dari ruang yang mengembang teregang ke panjang gelombang lebih panjang (lebih merah). Makin besar redshift (z), makin jauh dan makin "tua" cahayanya.','Light from receding objects, or crossing expanding space, is stretched to longer, redder wavelengths. The larger the redshift (z), the farther away and older the light.'),ex:X('JADES-GS-z14-0 memiliki z ≈ 14,3: cahayanya berangkat ~290 juta tahun setelah Big Bang.','JADES-GS-z14-0 has z ≈ 14.3; its light left ~290 million years after the Big Bang.'),go:{s:27}},
 {k:'cmb',t:X('Radiasi latar belakang kosmik (CMB)','Cosmic microwave background (CMB)'),d:X('Cahaya tertua yang bisa kita lihat, dilepas ~380.000 tahun setelah Big Bang. Kini teregang menjadi gelombang mikro bersuhu 2,725 K, datang merata dari segala arah.','The oldest light we can see, released ~380,000 years after the Big Bang. Now stretched to microwaves at 2.725 K, it arrives evenly from every direction.'),ex:X('Ditemukan tak sengaja oleh Penzias & Wilson tahun 1965 (Nobel 1978).','Found by accident by Penzias and Wilson in 1965 (Nobel Prize 1978).'),go:{s:27}},
 {k:'obs',t:X('Alam semesta teramati','Observable universe'),d:X('Bola berjari-jari ~46,5 miliar tahun cahaya di sekeliling kita: wilayah yang cahayanya sempat sampai ke Bumi. Alam semesta seluruhnya mungkin jauh lebih besar, bahkan tak terbatas.','A sphere ~46.5 billion light-years in radius around us: the region whose light has had time to reach us. The whole universe may be far larger, perhaps infinite.'),ex:X('Setiap pengamat, di galaksi mana pun, berada di pusat alam semesta teramatinya sendiri.','Every observer, in any galaxy, sits at the centre of their own observable universe.'),go:{s:27}}
];
