'Matahari':I('Bintang',[['Jenis','Katai kuning (G2V)'],['Diameter','~1,39 juta km (109 × Bumi)'],['Umur','~4,6 miliar tahun'],['Suhu permukaan','~5.500 °C']],'Di intinya, sekitar 15 juta °C, hidrogen digabung menjadi helium. Proses fusi inilah sumber cahayanya. Matahari diperkirakan masih bersinar stabil sekitar 5 miliar tahun lagi sebelum mengembang menjadi raksasa merah. Di level galaksi, lingkaran emas menunjukkan posisinya: sekitar 26.700 tahun cahaya dari pusat, di lengan kecil bernama Orion Spur.',
 'Star',[['Type','Yellow dwarf (G2V)'],['Diameter','~1.39 million km (109 × Earth)'],['Age','~4.6 billion years'],['Surface temperature','~5,500 °C']],'In its core, at about 15 million °C, hydrogen fuses into helium. That fusion is the source of its light. The Sun should keep shining steadily for about another 5 billion years before swelling into a red giant. At the galaxy level, the gold ring marks its position: about 26,700 light-years from the center, in a minor arm called the Orion Spur.','Matahari'),
'Merkurius':I('Planet',[['Jarak dari Matahari','0,39 AU'],['Diameter','4.879 km'],['Satu tahun','88 hari'],['Suhu','−180 °C sampai 430 °C']],'Planet terkecil dan terdekat ke Matahari. Hampir tanpa atmosfer, jadi panas siang langsung hilang di malam hari. Ia berotasi tepat 3 kali setiap 2 kali mengorbit (resonansi 3:2), sehingga satu hari matahari di sana sekitar 176 hari Bumi.',
 'Planet',[['Distance from Sun','0.39 AU'],['Diameter','4,879 km'],['Year','88 days'],['Temperature','−180 °C to 430 °C']],'The smallest planet and the closest to the Sun. With almost no atmosphere, daytime heat escapes at night. It rotates exactly 3 times for every 2 orbits (a 3:2 resonance), so one solar day there lasts about 176 Earth days.','Merkurius'),
'Venus':I('Planet',[['Jarak dari Matahari','0,72 AU'],['Diameter','12.104 km'],['Satu tahun','225 hari'],['Rotasi','243 hari, berlawanan arah']],'Ukurannya hampir sama dengan Bumi, tapi atmosfernya CO₂ tebal dengan tekanan sekitar 92 kali Bumi. Efek rumah kaca membuatnya jadi planet terpanas (~465 °C), lebih panas dari Merkurius. Rotasinya sangat lambat dan terbalik, jadi satu hari siderisnya lebih panjang dari satu tahunnya.',
 'Planet',[['Distance from Sun','0.72 AU'],['Diameter','12,104 km'],['Year','225 days'],['Rotation','243 days, retrograde']],'Almost Earth’s size, but wrapped in a thick CO₂ atmosphere at about 92 times Earth’s pressure. The greenhouse effect makes it the hottest planet (~465 °C), hotter than Mercury. It spins very slowly and backwards, so its sidereal day is longer than its year.','Venus'),
'Bumi':I('Planet',[['Jarak dari Matahari','1 AU (149,6 juta km)'],['Diameter','12.742 km'],['Satu tahun','365,25 hari'],['Kemiringan sumbu','23,44°']],'Satu-satunya tempat yang diketahui memiliki kehidupan. Sekitar 71% permukaannya tertutup air. Kemiringan sumbunya yang menyebabkan musim, bukan jaraknya ke Matahari: Bumi justru paling dekat ke Matahari sekitar awal Januari.',
 'Planet',[['Distance from Sun','1 AU (149.6 million km)'],['Diameter','12,742 km'],['Year','365.25 days'],['Axial tilt','23.44°']],'The only place known to host life. About 71% of its surface is covered by water. The seasons come from the tilt of its axis, not its distance from the Sun: Earth is actually closest to the Sun in early January.','Bumi'),
'Mars':I('Planet',[['Jarak dari Matahari','1,52 AU'],['Diameter','6.779 km'],['Satu tahun','687 hari'],['Satu hari','24 jam 37 menit']],'Warna merahnya berasal dari oksida besi (karat) di permukaan. Di sana ada Olympus Mons, gunung tertinggi di tata surya (sekitar 22 km), dan ngarai Valles Marineris sepanjang sekitar 4.000 km.',
 'Planet',[['Distance from Sun','1.52 AU'],['Diameter','6,779 km'],['Year','687 days'],['Day','24 h 37 min']],'Its red color comes from iron oxide (rust) on the surface. It has Olympus Mons, the tallest mountain in the solar system (about 22 km high), and the Valles Marineris canyon system, about 4,000 km long.','Mars'),
'Jupiter':I('Planet',[['Jarak dari Matahari','5,2 AU'],['Diameter','139.820 km (11 × Bumi)'],['Satu tahun','11,86 tahun'],['Satu hari','9 jam 56 menit']],'Massanya sekitar 2,5 kali gabungan semua planet lain. Jupiter adalah raksasa gas, sebagian besar hidrogen dan helium, tanpa permukaan padat. Gravitasinya membentuk sabuk asteroid: celah Kirkwood dan asteroid Trojan adalah jejak pengaruhnya. Jupiter punya lebih dari 90 bulan yang diketahui.',
 'Planet',[['Distance from Sun','5.2 AU'],['Diameter','139,820 km (11 × Earth)'],['Year','11.86 years'],['Day','9 h 56 min']],'About 2.5 times as massive as all the other planets combined. Jupiter is a gas giant, mostly hydrogen and helium, with no solid surface. Its gravity shapes the asteroid belt: the Kirkwood gaps and the Trojan asteroids are its fingerprints. It has more than 90 known moons.','Jupiter'),
'Saturnus':I('Planet',[['Jarak dari Matahari','9,5 AU'],['Diameter','116.460 km'],['Satu tahun','29,4 tahun'],['Kerapatan','lebih kecil dari air']],'Cincinnya tersusun dari bongkahan es dan batu, dari butiran debu sampai sebesar rumah. Lebarnya ratusan ribu kilometer, tapi tebalnya umumnya hanya belasan meter. Per 2025, Saturnus adalah planet dengan bulan terbanyak yang diketahui, sekitar 270-an.',
 'Planet',[['Distance from Sun','9.5 AU'],['Diameter','116,460 km'],['Year','29.4 years'],['Density','less than water']],'Its rings are made of chunks of ice and rock, from dust grains to house-sized boulders. They span hundreds of thousands of kilometers but are typically only tens of meters thick. As of 2025, Saturn has the most known moons of any planet, around 270-something.','Saturnus'),
'Uranus':I('Planet',[['Jarak dari Matahari','19,2 AU'],['Diameter','50.724 km'],['Satu tahun','84 tahun'],['Kemiringan sumbu','97,8°']],'Uranus "berguling" pada orbitnya: sumbunya hampir sejajar dengan bidang orbit. Akibatnya, tiap kutub mengalami sekitar 42 tahun siang lalu 42 tahun malam. Satu-satunya wahana yang pernah mengunjunginya adalah Voyager 2, pada 1986.',
 'Planet',[['Distance from Sun','19.2 AU'],['Diameter','50,724 km'],['Year','84 years'],['Axial tilt','97.8°']],'Uranus "rolls" along its orbit: its axis lies almost in the plane of the orbit. As a result, each pole gets about 42 years of daylight followed by 42 years of night. The only spacecraft to visit it was Voyager 2, in 1986.','Uranus'),
'Neptunus':I('Planet',[['Jarak dari Matahari','30,1 AU'],['Diameter','49.244 km'],['Satu tahun','164,8 tahun'],['Angin','sampai ~2.000 km/jam']],'Neptunus ditemukan pada 1846 lewat matematika sebelum terlihat lewat teleskop. Astronom melihat orbit Uranus menyimpang, lalu menghitung di mana planet pengganggunya seharusnya berada. Teleskop diarahkan ke sana, dan Neptunus memang ada di dekat titik prediksi itu.',
 'Planet',[['Distance from Sun','30.1 AU'],['Diameter','49,244 km'],['Year','164.8 years'],['Winds','up to ~2,000 km/h']],'Neptune was found in 1846 by mathematics before anyone saw it through a telescope. Astronomers noticed Uranus straying from its predicted path and calculated where a disturbing planet should be. When a telescope was pointed there, Neptune was close to the predicted spot.','Neptunus'),
'Pluto':I('Planet kerdil',[['Jarak rata-rata','39,5 AU'],['Diameter','2.377 km'],['Satu tahun','248 tahun'],['Status','planet kerdil sejak 2006']],'Anggota terkenal Sabuk Kuiper. Wahana New Horizons melintasinya pada 2015 dan memotret dataran es berbentuk hati (Tombaugh Regio). Pluto mengorbit Matahari dua kali setiap tiga putaran Neptunus, sehingga keduanya tidak pernah bertabrakan walaupun orbitnya tampak bersilangan.',
 'Dwarf planet',[['Average distance','39.5 AU'],['Diameter','2,377 km'],['Year','248 years'],['Status','dwarf planet since 2006']],'The best-known member of the Kuiper Belt. New Horizons flew past it in 2015 and photographed a heart-shaped icy plain (Tombaugh Regio). Pluto orbits twice for every three orbits of Neptune, so the two never collide even though their orbits appear to cross.'),
'Bulan':I('Satelit Bumi',[['Jarak','~384.400 km'],['Diameter','3.474 km'],['Orbit (sideris)','27,3 hari'],['Purnama ke purnama','29,5 hari']],'Bulan selalu menghadapkan sisi yang sama ke Bumi karena terkunci pasang surut: ia berotasi tepat sekali setiap mengorbit. Bulan juga perlahan menjauh, sekitar 3,8 cm per tahun, terukur dengan laser yang dipantulkan ke cermin yang ditinggalkan misi Apollo.',
 'Moon of Earth',[['Distance','~384,400 km'],['Diameter','3,474 km'],['Orbit (sidereal)','27.3 days'],['Full moon to full moon','29.5 days']],'The Moon always shows Earth the same face because it is tidally locked: it rotates exactly once per orbit. It is also slowly drifting away, about 3.8 cm per year, measured with lasers bounced off mirrors left by the Apollo missions.','Bumi'),
'Phobos':I('Satelit Mars',[['Jarak dari pusat Mars','9.376 km'],['Ukuran','~27 × 22 × 18 km'],['Orbit','7 jam 39 menit']],'Phobos mengorbit lebih cepat daripada Mars berotasi, jadi dari permukaan Mars ia terbit di barat dan terbenam di timur, dua kali sehari. Orbitnya perlahan menyusut; dalam puluhan juta tahun ia diperkirakan hancur menjadi cincin atau jatuh ke Mars. Bentuk aslinya tidak bulat.',
 'Moon of Mars',[['Distance from Mars’s center','9,376 km'],['Size','~27 × 22 × 18 km'],['Orbit','7 h 39 min']],'Phobos orbits faster than Mars rotates, so from the Martian surface it rises in the west and sets in the east, twice a day. Its orbit is slowly shrinking; within tens of millions of years it is expected to break into a ring or fall onto Mars. Its real shape is not round.','Mars'),
'Deimos':I('Satelit Mars',[['Jarak dari pusat Mars','23.463 km'],['Ukuran','~15 × 12 × 11 km'],['Orbit','30,3 jam']],'Bulan Mars yang lebih kecil dan lebih jauh. Dilihat dari Mars, ia hanya tampak seperti bintang terang. Seperti Phobos, Deimos kemungkinan asteroid yang tertangkap, atau sisa tabrakan besar di masa lalu Mars.',
 'Moon of Mars',[['Distance from Mars’s center','23,463 km'],['Size','~15 × 12 × 11 km'],['Orbit','30.3 h']],'The smaller, more distant moon of Mars. Seen from Mars it looks like little more than a bright star. Like Phobos, Deimos may be a captured asteroid, or debris from a giant impact early in Mars’s history.','Mars'),
'Io':I('Satelit Jupiter',[['Jarak dari Jupiter','421.700 km'],['Diameter','3.643 km'],['Orbit','1,77 hari']],'Benda paling aktif secara vulkanik di tata surya, dengan ratusan gunung api aktif. Panasnya berasal dari pasang surut: resonansi dengan Europa dan Ganymede membuat orbitnya sedikit lonjong, sehingga Io terus "diremas" oleh gravitasi Jupiter.',
 'Moon of Jupiter',[['Distance from Jupiter','421,700 km'],['Diameter','3,643 km'],['Orbit','1.77 days']],'The most volcanically active body in the solar system, with hundreds of active volcanoes. Its heat comes from tides: the resonance with Europa and Ganymede keeps its orbit slightly elongated, so Io is constantly "squeezed" by Jupiter’s gravity.','Jupiter'),
'Europa':I('Satelit Jupiter',[['Jarak dari Jupiter','671.034 km'],['Diameter','3.122 km'],['Orbit','3,55 hari']],'Di bawah kerak esnya diduga ada lautan air asin yang volumenya bisa melebihi semua lautan Bumi. Karena itu Europa menjadi salah satu tempat terbaik untuk mencari kehidupan di luar Bumi. Wahana Europa Clipper diluncurkan pada 2024 untuk menelitinya.',
 'Moon of Jupiter',[['Distance from Jupiter','671,034 km'],['Diameter','3,122 km'],['Orbit','3.55 days']],'Beneath its icy crust there is thought to be a salty ocean that may hold more water than all of Earth’s oceans. That makes Europa one of the best places to look for life beyond Earth. The Europa Clipper spacecraft launched in 2024 to study it.','Jupiter'),
'Ganymede':I('Satelit Jupiter',[['Jarak dari Jupiter','1.070.412 km'],['Diameter','5.268 km'],['Orbit','7,15 hari']],'Bulan terbesar di tata surya, bahkan lebih besar dari planet Merkurius. Ganymede juga satu-satunya bulan yang diketahui punya medan magnet sendiri, dan diduga menyimpan lautan di bawah permukaannya.',
 'Moon of Jupiter',[['Distance from Jupiter','1,070,412 km'],['Diameter','5,268 km'],['Orbit','7.15 days']],'The largest moon in the solar system, bigger even than the planet Mercury. It is also the only moon known to have its own magnetic field, and it probably hides an ocean beneath its surface.','Jupiter'),
'Callisto':I('Satelit Jupiter',[['Jarak dari Jupiter','1.882.709 km'],['Diameter','4.821 km'],['Orbit','16,7 hari']],'Permukaannya salah satu yang paling banyak kawahnya di tata surya. Itu tanda permukaannya sangat tua dan hampir tidak berubah selama miliaran tahun. Callisto tidak ikut dalam resonansi 1:2:4 tiga bulan lainnya.',
 'Moon of Jupiter',[['Distance from Jupiter','1,882,709 km'],['Diameter','4,821 km'],['Orbit','16.7 days']],'One of the most heavily cratered surfaces in the solar system, a sign that it is very old and has barely changed for billions of years. Callisto is not part of the 1:2:4 resonance of the other three.','Jupiter'),
'Enceladus':I('Satelit Saturnus',[['Jarak dari Saturnus','237.948 km'],['Diameter','504 km'],['Orbit','1,37 hari']],'Bulan es kecil yang menyemburkan air dari retakan di kutub selatannya. Semburan ini mengisi cincin E Saturnus. Wahana Cassini terbang menembus semburannya dan mendeteksi garam serta molekul organik, petunjuk adanya lautan di bawah es.',
 'Moon of Saturn',[['Distance from Saturn','237,948 km'],['Diameter','504 km'],['Orbit','1.37 days']],'A small icy moon that sprays water from cracks near its south pole. The plumes feed Saturn’s E ring. The Cassini spacecraft flew through them and detected salts and organic molecules, evidence of an ocean beneath the ice.','Saturnus'),
'Rhea':I('Satelit Saturnus',[['Jarak dari Saturnus','527.108 km'],['Diameter','1.527 km'],['Orbit','4,5 hari']],'Bulan terbesar kedua Saturnus. Rhea sebagian besar terdiri dari es air dengan sedikit batuan, dan permukaannya dipenuhi kawah tua.',
 'Moon of Saturn',[['Distance from Saturn','527,108 km'],['Diameter','1,527 km'],['Orbit','4.5 days']],'Saturn’s second-largest moon. Rhea is mostly water ice with a little rock, and its surface is covered in old craters.','Saturnus'),
'Titan':I('Satelit Saturnus',[['Jarak dari Saturnus','1.221.870 km'],['Diameter','5.150 km'],['Orbit','15,9 hari']],'Satu-satunya bulan dengan atmosfer tebal, sebagian besar nitrogen, dengan tekanan sekitar 1,5 kali Bumi. Di permukaannya ada danau dan sungai metana cair. Wahana Huygens mendarat di sana pada 2005, dan NASA menyiapkan misi helikopter Dragonfly untuk menjelajahinya.',
 'Moon of Saturn',[['Distance from Saturn','1,221,870 km'],['Diameter','5,150 km'],['Orbit','15.9 days']],'The only moon with a thick atmosphere, mostly nitrogen, at about 1.5 times Earth’s surface pressure. Its surface has lakes and rivers of liquid methane. The Huygens probe landed there in 2005, and NASA is preparing the Dragonfly rotorcraft mission to explore it.','Saturnus'),
'Iapetus':I('Satelit Saturnus',[['Jarak dari Saturnus','3.560.820 km'],['Diameter','1.469 km'],['Orbit','79,3 hari']],'Bulan "dua warna": satu belahannya gelap seperti arang, belahan lainnya terang seperti salju. Di ekuatornya ada punggungan yang tingginya bisa mencapai belasan kilometer. Orbitnya miring sekitar 15° terhadap ekuator Saturnus, seperti yang terlihat di layar.',
 'Moon of Saturn',[['Distance from Saturn','3,560,820 km'],['Diameter','1,469 km'],['Orbit','79.3 days']],'The "two-toned" moon: one hemisphere is dark as charcoal, the other bright as snow. A ridge up to a dozen or so kilometers high runs along its equator. Its orbit is tilted about 15° to Saturn’s equator, as you can see on screen.','Saturnus'),
'Sabuk asteroid':I('Wilayah tata surya',[['Letak','~2,2 – 3,3 AU'],['Massa total','~3% massa Bulan'],['Anggota terbesar','Ceres (~940 km)']],'Berbeda dari film, sabuk asteroid sangat lengang: jarak rata-rata antar asteroid ratusan ribu sampai jutaan kilometer. Ceres sendiri menyumbang sekitar sepertiga massa sabuk. Celah Kirkwood muncul di jarak yang periode orbitnya sebanding bulat dengan Jupiter (3:1, 5:2, 7:3, 2:1).',
 'Region of the solar system',[['Location','~2.2 – 3.3 AU'],['Total mass','~3% of the Moon’s'],['Largest member','Ceres (~940 km)']],'Unlike in the movies, the asteroid belt is mostly empty: neighboring asteroids are typically hundreds of thousands to millions of kilometers apart. Ceres alone holds about a third of the belt’s mass. The Kirkwood gaps sit where orbital periods form simple ratios with Jupiter’s (3:1, 5:2, 7:3, 2:1).'),
'Trojan':I('Kelompok asteroid',[['Letak','titik Lagrange L4 dan L5 Jupiter'],['Jumlah diketahui','lebih dari 10.000'],['Misi','Lucy (diluncurkan 2021)']],'Di titik 60° di depan (L4) dan di belakang (L5) Jupiter, gravitasi Matahari dan Jupiter berimbang sedemikian rupa sehingga asteroid bisa "menumpang" di orbit Jupiter dengan stabil. Wahana Lucy dijadwalkan mengunjungi beberapa Trojan mulai 2027.',
 'Asteroid group',[['Location','Jupiter’s L4 and L5 Lagrange points'],['Known members','more than 10,000'],['Mission','Lucy (launched 2021)']],'At the points 60° ahead of (L4) and behind (L5) Jupiter, the gravity of the Sun and Jupiter balance so that asteroids can ride stably along Jupiter’s orbit. The Lucy spacecraft is scheduled to visit several Trojans starting in 2027.'),
'Sabuk Kuiper':I('Wilayah tata surya',[['Letak','~30 – 50 AU'],['Anggota terkenal','Pluto, Haumea, Makemake'],['Dikunjungi','New Horizons']],'Cakram berisi benda es sisa pembentukan tata surya, mirip sabuk asteroid tapi jauh lebih besar dan lebih dingin. Sabuk Kuiper adalah sumber banyak komet berperiode pendek. New Horizons melintasi objek Arrokoth di sana pada 2019.',
 'Region of the solar system',[['Location','~30 – 50 AU'],['Notable members','Pluto, Haumea, Makemake'],['Visited by','New Horizons']],'A disk of icy leftovers from the formation of the solar system, like the asteroid belt but far larger and colder. The Kuiper Belt is the source of many short-period comets. New Horizons flew past the object Arrokoth there in 2019.'),
'Voyager 1':I('Wahana antariksa',[['Diluncurkan','5 September 1977'],['Kecepatan','~17 km/detik'],['Melintasi heliopause','Agustus 2012']],'Benda buatan manusia terjauh. Voyager 1 memotret Jupiter (1979) dan Saturnus (1980), lalu terus melaju keluar dan memotret "Pale Blue Dot" pada 1990. Ia membawa Golden Record berisi suara dan gambar dari Bumi. Dayanya terus menurun, sehingga instrumennya dimatikan satu per satu.',
 'Spacecraft',[['Launched','September 5, 1977'],['Speed','~17 km/s'],['Crossed the heliopause','August 2012']],'The most distant human-made object. Voyager 1 photographed Jupiter (1979) and Saturn (1980), kept heading outward, and took the "Pale Blue Dot" photo in 1990. It carries the Golden Record of sounds and images from Earth. Its power keeps declining, so its instruments are being switched off one by one.'),
'Heliopause':I('Batas tata surya',[['Jarak','~120 AU'],['Dilintasi','Voyager 1 (2012), Voyager 2 (2018)']],'Batas tempat angin Matahari, aliran partikel bermuatan dari Matahari, tidak lagi mampu mendorong medium antarbintang. Di luar batas ini, partikel di sekitar wahana sudah berasal dari bintang-bintang lain. Gravitasi Matahari tetap berpengaruh jauh melewati batas ini, sampai Awan Oort.',
 'Boundary of the solar system',[['Distance','~120 AU'],['Crossed by','Voyager 1 (2012), Voyager 2 (2018)']],'The boundary where the solar wind, the stream of charged particles from the Sun, can no longer push back the interstellar medium. Beyond it, the particles around a spacecraft come from other stars. The Sun’s gravity still reaches far past this boundary, out to the Oort Cloud.'),
'Tepi luar Awan Oort':I('Wilayah hipotetis',[['Jarak','~100.000 AU (~1,6 tc), diperkirakan'],['Diusulkan','Jan Oort, 1950'],['Periode orbit di tepi','~31,6 juta tahun']],'Batas tempat gravitasi Matahari mulai kalah oleh tarikan bintang lain dan galaksi. Benda di sini sangat mudah terganggu oleh bintang yang lewat, sehingga sesekali jatuh ke dalam tata surya sebagai komet berperiode sangat panjang.',
 'Hypothetical region',[['Distance','~100,000 AU (~1.6 ly), estimated'],['Proposed by','Jan Oort, 1950'],['Orbital period at the edge','~31.6 million years']],'The limit where the Sun’s gravity starts to lose out to the pull of other stars and the galaxy. Bodies here are easily nudged by passing stars, and occasionally fall into the inner solar system as very long-period comets.'),
'Tepi dalam':I('Wilayah hipotetis',[['Jarak','~2.000 AU'],['Nama lain','awan Hills (bagian dalam)']],'Bagian dalam Awan Oort diduga lebih rapat dan lebih pipih daripada bagian luarnya. Objek seperti Sedna, yang orbitnya membentang hingga ratusan AU lebih, mungkin berasal dari wilayah ini.',
 'Hypothetical region',[['Distance','~2,000 AU'],['Also called','the (inner) Hills cloud']],'The inner Oort Cloud is thought to be denser and flatter than the outer part. Objects like Sedna, whose orbit stretches out to hundreds of AU, may come from this region.'),
'Proxima Centauri':I('Bintang',[['Jarak','4,24 tahun cahaya'],['Jenis','katai merah'],['Planet','Proxima b (2016), di zona laik huni']],'Bintang terdekat dari Matahari, tapi terlalu redup untuk dilihat mata telanjang. Ia anggota ketiga sistem Alpha Centauri. Dengan wahana tercepat yang ada saat ini, perjalanan ke sana masih butuh ribuan tahun.',
 'Star',[['Distance','4.24 light-years'],['Type','red dwarf'],['Planet','Proxima b (2016), in the habitable zone']],'The nearest star to the Sun, yet too faint to see with the naked eye. It is the third member of the Alpha Centauri system. With today’s fastest spacecraft, the trip would still take thousands of years.'),
'Alpha Centauri':I('Sistem bintang',[['Jarak','4,37 tahun cahaya'],['Anggota','Alpha Cen A, B, dan Proxima'],['Kecerahan','titik terang ke-3 di langit malam']],'Dua bintang mirip Matahari yang saling mengorbit, ditemani Proxima di kejauhan. Alpha Centauri terletak di langit selatan dan bisa dilihat dari Indonesia, di dekat rasi Salib Selatan.',
 'Star system',[['Distance','4.37 light-years'],['Members','Alpha Cen A, B, and Proxima'],['Brightness','3rd brightest point in the night sky']],'Two Sun-like stars orbiting each other, with Proxima far out. Alpha Centauri lies in the southern sky near the Southern Cross and is easily seen from the Southern Hemisphere and the tropics.'),
'Bintang Barnard':I('Bintang',[['Jarak','5,96 tahun cahaya'],['Jenis','katai merah']],'Bintang dengan gerak diri tercepat di langit: posisinya bergeser sekitar setengah diameter Bulan dalam 180 tahun. Pada 2024–2025, astronom melaporkan beberapa planet kecil yang mengorbitnya.',
 'Star',[['Distance','5.96 light-years'],['Type','red dwarf']],'The star with the fastest proper motion in the sky: it shifts by about half the Moon’s diameter in 180 years. In 2024–2025, astronomers reported several small planets orbiting it.'),
'Wolf 359':I('Bintang',[['Jarak','7,86 tahun cahaya'],['Jenis','katai merah']],'Salah satu bintang terdekat, tapi sangat redup sehingga butuh teleskop untuk melihatnya. Katai merah seperti ini adalah jenis bintang paling umum di galaksi, walaupun tidak satu pun terlihat oleh mata telanjang.',
 'Star',[['Distance','7.86 light-years'],['Type','red dwarf']],'One of the nearest stars, but so faint that you need a telescope to see it. Red dwarfs like this are the most common stars in the galaxy, yet not a single one is visible to the naked eye.'),
'Sirius':I('Bintang',[['Jarak','8,6 tahun cahaya'],['Jenis','bintang putih (A1V)'],['Pendamping','katai putih Sirius B']],'Bintang paling terang di langit malam. Pendampingnya, Sirius B, adalah katai putih: sisa inti bintang yang massanya hampir sama dengan Matahari tapi ukurannya hanya sebesar Bumi.',
 'Star',[['Distance','8.6 light-years'],['Type','white star (A1V)'],['Companion','white dwarf Sirius B']],'The brightest star in the night sky. Its companion, Sirius B, is a white dwarf: the leftover core of a star, with nearly the Sun’s mass packed into something the size of Earth.'),
'Epsilon Eridani':I('Bintang',[['Jarak','10,5 tahun cahaya'],['Jenis','katai jingga, lebih muda dari Matahari']],'Bintang yang mirip Matahari versi muda. Ia dikelilingi cakram debu dan setidaknya satu planet raksasa, sehingga sering dipelajari sebagai gambaran tata surya kita di masa awal.',
 'Star',[['Distance','10.5 light-years'],['Type','orange dwarf, younger than the Sun']],'Something like a young version of the Sun. It is surrounded by dusty debris disks and at least one giant planet, so it is often studied as a picture of our own solar system in its youth.'),
'Procyon':I('Bintang',[['Jarak','11,46 tahun cahaya'],['Rasi','Canis Minor'],['Pendamping','katai putih Procyon B']],'Salah satu bintang paling terang di langit. Seperti Sirius, Procyon punya pendamping katai putih yang redup.',
 'Star',[['Distance','11.46 light-years'],['Constellation','Canis Minor'],['Companion','white dwarf Procyon B']],'One of the brightest stars in the sky. Like Sirius, Procyon has a faint white dwarf companion.'),
'Tau Ceti':I('Bintang',[['Jarak','11,9 tahun cahaya'],['Jenis','katai kuning, sedikit lebih kecil dari Matahari']],'Bintang tunggal yang mirip Matahari dan berada dekat, sehingga sering menjadi target pencarian kehidupan, termasuk dalam Project Ozma tahun 1960, salah satu pencarian sinyal radio dari peradaban lain yang pertama.',
 'Star',[['Distance','11.9 light-years'],['Type','yellow dwarf, slightly smaller than the Sun']],'A nearby, single, Sun-like star, so it is a frequent target in the search for life, including Project Ozma in 1960, one of the first searches for radio signals from other civilizations.'),
'Altair':I('Bintang',[['Jarak','16,7 tahun cahaya'],['Rotasi','~9 jam']],'Altair berotasi begitu cepat sehingga bentuknya gepeng: diameter di ekuatornya sekitar 20% lebih besar daripada antarkutub. Bersama Vega dan Deneb, ia membentuk Segitiga Musim Panas.',
 'Star',[['Distance','16.7 light-years'],['Rotation','~9 hours']],'Altair spins so fast that it is flattened: its equatorial diameter is about 20% larger than its polar diameter. Together with Vega and Deneb it forms the Summer Triangle.'),
'Vega':I('Bintang',[['Jarak','25 tahun cahaya'],['Jenis','bintang putih (A0V)']],'Karena sumbu Bumi bergoyang pelan (presesi, satu putaran sekitar 26.000 tahun), bintang kutub ikut berganti. Vega pernah menjadi bintang kutub utara sekitar 12.000 tahun lalu dan akan menjadi bintang kutub lagi sekitar tahun 13.700.',
 'Star',[['Distance','25 light-years'],['Type','white star (A0V)']],'Because Earth’s axis slowly wobbles (precession, one cycle in about 26,000 years), the pole star changes over time. Vega was the northern pole star about 12,000 years ago and will be again around the year 13,700.'),
'Arcturus':I('Bintang',[['Jarak','36,7 tahun cahaya'],['Jenis','raksasa jingga']],'Bintang paling terang di belahan langit utara. Arcturus adalah bintang tua yang sudah melewati tahap seperti Matahari dan mengembang menjadi raksasa, gambaran masa depan Matahari kita.',
 'Star',[['Distance','36.7 light-years'],['Type','orange giant']],'The brightest star in the northern celestial hemisphere. Arcturus is an old star that has already passed through a Sun-like stage and swelled into a giant, a preview of our Sun’s future.'),
'Aldebaran':I('Bintang',[['Jarak','65 tahun cahaya'],['Jenis','raksasa merah'],['Rasi','Taurus']],'"Mata" sang banteng di rasi Taurus. Wahana Pioneer 10 kini melaju ke arah umum Aldebaran dan baru akan melewatinya dalam sekitar dua juta tahun.',
 'Star',[['Distance','65 light-years'],['Type','red giant'],['Constellation','Taurus']],'The "eye" of the bull in Taurus. The Pioneer 10 spacecraft is heading in the general direction of Aldebaran and will pass it in about two million years.'),
'Polaris':I('Bintang',[['Jarak','~430 tahun cahaya (masih diperdebatkan)'],['Peran','bintang kutub utara saat ini']],'Polaris tampak hampir diam di langit karena letaknya hampir tepat di atas kutub utara Bumi. Dari Jakarta, yang berada di selatan khatulistiwa, Polaris selalu berada di bawah cakrawala.',
 'Star',[['Distance','~430 light-years (still debated)'],['Role','the current North Star']],'Polaris seems almost motionless in the sky because it sits nearly directly above Earth’s north pole. From anywhere south of the equator, Polaris is always below the horizon.'),
'Betelgeuse':I('Bintang',[['Jarak','~550 tahun cahaya (tidak pasti)'],['Jenis','maharaksasa merah'],['Rasi','Orion']],'Jika diletakkan di posisi Matahari, permukaannya akan menjangkau melewati orbit Mars. Betelgeuse diperkirakan meledak sebagai supernova dalam ~100.000 tahun ke depan. Pada 2019–2020 ia meredup drastis ("Great Dimming") akibat awan debu yang ia lontarkan sendiri.',
 'Star',[['Distance','~550 light-years (uncertain)'],['Type','red supergiant'],['Constellation','Orion']],'Placed where the Sun is, its surface would reach beyond the orbit of Mars. Betelgeuse is expected to explode as a supernova within the next ~100,000 years. In 2019–2020 it dimmed dramatically (the "Great Dimming") because of a dust cloud it had ejected.'),
'Bellatrix':I('Bintang',[['Jarak','~250 tahun cahaya'],['Jenis','raksasa biru'],['Rasi','Orion (bahu)']],'Bahu Orion yang lain selain Betelgeuse. Walaupun tampak berdampingan di langit, Bellatrix jauh lebih dekat ke kita daripada Betelgeuse. Putar kamera untuk melihat perbedaan kedalamannya.',
 'Star',[['Distance','~250 light-years'],['Type','blue giant'],['Constellation','Orion (shoulder)']],'Orion’s other shoulder besides Betelgeuse. Although they look side by side in the sky, Bellatrix is much closer to us than Betelgeuse. Rotate the camera to see the difference in depth.'),
'Rigel':I('Bintang',[['Jarak','~860 tahun cahaya'],['Jenis','maharaksasa biru'],['Rasi','Orion (kaki)']],'Salah satu bintang paling luminous yang terlihat mata telanjang, memancarkan cahaya puluhan ribu kali Matahari. Cahaya Rigel yang kamu lihat malam ini berangkat sekitar abad ke-12.',
 'Star',[['Distance','~860 light-years'],['Type','blue supergiant'],['Constellation','Orion (foot)']],'One of the most luminous stars visible to the naked eye, shining tens of thousands of times brighter than the Sun. The light from Rigel you see tonight set out around the 12th century.'),
'Saiph':I('Bintang',[['Jarak','~650 tahun cahaya'],['Jenis','maharaksasa biru'],['Rasi','Orion (kaki)']],'Kaki kanan Orion. Saiph adalah bintang yang sangat luminous, tapi sebagian besar cahayanya berupa ultraviolet yang tidak terlihat mata, sehingga di langit ia tampak lebih redup daripada Rigel.',
 'Star',[['Distance','~650 light-years'],['Type','blue supergiant'],['Constellation','Orion (foot)']],'Orion’s other foot. Saiph is very luminous, but most of its light is ultraviolet, invisible to our eyes, so it looks fainter than Rigel in the sky.'),
'Mintaka':I('Bintang (Sabuk Orion)',[['Jarak','~1.200 tahun cahaya (tidak pasti)'],['Jenis','sistem bintang biru ganda']],'Salah satu dari tiga bintang Sabuk Orion. Ketiganya tampak berjajar rapi, tapi jaraknya ke kita berbeda ratusan tahun cahaya. Kebetulan arah pandang kita membuatnya tampak sebaris.',
 'Star (Orion’s Belt)',[['Distance','~1,200 light-years (uncertain)'],['Type','blue multiple star']],'One of the three stars of Orion’s Belt. They look neatly lined up, but their distances from us differ by hundreds of light-years. It is a coincidence of our line of sight.'),
'Alnilam':I('Bintang (Sabuk Orion)',[['Jarak','~2.000 tahun cahaya (tidak pasti)'],['Jenis','maharaksasa biru']],'Bintang tengah Sabuk Orion dan yang paling jauh di antara ketiganya. Pengukuran jaraknya masih sangat tidak pasti karena terlalu jauh untuk diukur dengan paralaks secara akurat.',
 'Star (Orion’s Belt)',[['Distance','~2,000 light-years (uncertain)'],['Type','blue supergiant']],'The middle star of Orion’s Belt and the farthest of the three. Its distance is still very uncertain because it is too far away for an accurate parallax measurement.'),
'Alnitak':I('Bintang (Sabuk Orion)',[['Jarak','~1.260 tahun cahaya (tidak pasti)'],['Jenis','sistem bintang biru']],'Bintang paling timur di Sabuk Orion. Di dekatnya ada Nebula Kepala Kuda dan Nebula Api, dua objek favorit astrofotografi.',
 'Star (Orion’s Belt)',[['Distance','~1,260 light-years (uncertain)'],['Type','blue multiple star']],'The easternmost star of Orion’s Belt. Nearby lie the Horsehead Nebula and the Flame Nebula, two favorites of astrophotographers.'),
'Deneb':I('Bintang',[['Jarak','~1.500–2.600 tahun cahaya (sangat tidak pasti)'],['Jenis','maharaksasa putih']],'Salah satu bintang paling luminous yang bisa dilihat mata telanjang. Karena tampak terang walau sangat jauh, kecerahan aslinya bisa puluhan ribu kali Matahari, tergantung jarak sebenarnya.',
 'Star',[['Distance','~1,500–2,600 light-years (very uncertain)'],['Type','white supergiant']],'One of the most luminous stars visible to the naked eye. Because it looks bright despite being so far away, its true brightness must be tens of thousands of times the Sun’s, depending on its actual distance.'),
'Pusat galaksi':I('Lubang hitam supermasif',[['Nama','Sagittarius A*'],['Massa','~4 juta × Matahari'],['Jarak','~26.700 tahun cahaya']],'Bintang-bintang di dekat pusat galaksi bergerak sangat cepat mengitari sesuatu yang tak terlihat. Dari orbit mereka, astronom menghitung massanya. Penemuan ini meraih Nobel Fisika 2020, dan pada 2022 Event Horizon Telescope merilis citra bayangan lubang hitam ini.',
 'Supermassive black hole',[['Name','Sagittarius A*'],['Mass','~4 million × Sun'],['Distance','~26,700 light-years']],'Stars near the galactic center whip around something invisible. From their orbits, astronomers calculated its mass. The discovery earned the 2020 Nobel Prize in Physics, and in 2022 the Event Horizon Telescope released an image of this black hole’s shadow.'),
'Bima Sakti':I('Galaksi kita',[['Diameter','~100.000 tahun cahaya'],['Jumlah bintang','100–400 miliar'],['Jenis','spiral berpalang']],'Pita cahaya samar di langit malam adalah piringan galaksi ini yang kita lihat dari dalam. Karena kita berada di dalamnya, bentuk utuhnya tidak pernah difoto langsung; gambaran yang ada disusun dari pengukuran posisi dan gerak bintang.',
 'Our galaxy',[['Diameter','~100,000 light-years'],['Stars','100–400 billion'],['Type','barred spiral']],'The faint band of light across the night sky is this galaxy’s disk seen from inside. Because we live within it, its full shape has never been photographed; our picture of it is assembled from measurements of star positions and motions.'),
'Andromeda':I('Galaksi',[['Jarak','~2,5 juta tahun cahaya'],['Diameter','~150.000–220.000 tahun cahaya'],['Bintang','~1 triliun']],'Galaksi besar terdekat dan objek terjauh yang mudah dilihat mata telanjang dari tempat gelap. Cahaya yang kamu lihat darinya berangkat sekitar 2,5 juta tahun lalu, saat nenek moyang manusia awal baru muncul.',
 'Galaxy',[['Distance','~2.5 million light-years'],['Diameter','~150,000–220,000 light-years'],['Stars','~1 trillion']],'The nearest large galaxy and the most distant object easily seen with the naked eye from a dark site. The light you see from it left about 2.5 million years ago, around when the earliest human ancestors appeared.'),
'Triangulum':I('Galaksi',[['Jarak','~2,73 juta tahun cahaya'],['Diameter','~60.000 tahun cahaya']],'Anggota terbesar ketiga Local Group setelah Andromeda dan Bima Sakti. Kemungkinan besar ia adalah satelit Andromeda. Dari tempat yang sangat gelap, ia di ambang batas terlihat mata telanjang.',
 'Galaxy',[['Distance','~2.73 million light-years'],['Diameter','~60,000 light-years']],'The third-largest member of the Local Group after Andromeda and the Milky Way, most likely a satellite of Andromeda. From a very dark site it is at the edge of naked-eye visibility.'),
'Awan Magellan Besar':I('Galaksi satelit',[['Jarak','~163.000 tahun cahaya'],['Diameter','~14.000 tahun cahaya']],'Galaksi satelit Bima Sakti yang terlihat seperti potongan awan di langit selatan, termasuk dari Indonesia. Pada 1987 sebuah supernova (SN 1987A) meledak di sini, supernova terdekat yang teramati sejak teleskop ditemukan.',
 'Satellite galaxy',[['Distance','~163,000 light-years'],['Diameter','~14,000 light-years']],'A satellite galaxy of the Milky Way that looks like a detached patch of cloud in the southern sky. In 1987 a supernova (SN 1987A) exploded here, the nearest supernova observed since the invention of the telescope.'),
'Awan Magellan Kecil':I('Galaksi satelit',[['Jarak','~200.000 tahun cahaya'],['Diameter','~7.000 tahun cahaya']],'Pasangan Awan Magellan Besar. Gravitasi kedua awan dan Bima Sakti saling menarik, menghasilkan jejak gas raksasa bernama Arus Magellan yang membentang di langit.',
 'Satellite galaxy',[['Distance','~200,000 light-years'],['Diameter','~7,000 light-years']],'Companion of the Large Magellanic Cloud. The mutual pull of the two Clouds and the Milky Way has drawn out a giant trail of gas called the Magellanic Stream that stretches across the sky.'),
'Local Group':I('Kelompok galaksi',[['Diameter','~10 juta tahun cahaya'],['Anggota','lebih dari 80 galaksi']],'Kelompok galaksi tempat kita tinggal. Sebagian besar anggotanya galaksi kerdil yang mengitari Bima Sakti atau Andromeda. Di skala Laniakea, seluruh kelompok ini hanya satu titik kecil.',
 'Galaxy group',[['Diameter','~10 million light-years'],['Members','more than 80 galaxies']],'The group of galaxies we live in. Most members are dwarf galaxies orbiting either the Milky Way or Andromeda. At the scale of Laniakea, the whole group is a single small dot.'),
'Gugus Virgo':I('Gugus galaksi',[['Jarak','~54 juta tahun cahaya'],['Anggota','lebih dari 1.000 galaksi']],'Gugus galaksi besar terdekat dan inti dari Supergugus Virgo. Di pusatnya ada galaksi raksasa M87, yang lubang hitamnya menjadi lubang hitam pertama yang dicitrakan (Event Horizon Telescope, 2019).',
 'Galaxy cluster',[['Distance','~54 million light-years'],['Members','more than 1,000 galaxies']],'The nearest large galaxy cluster and the heart of the Virgo Supercluster. At its center sits the giant galaxy M87, whose black hole was the first ever imaged (Event Horizon Telescope, 2019).'),
'Gugus Hydra':I('Gugus galaksi',[['Jarak','~160 juta tahun cahaya'],['Nama katalog','Abell 1060']],'Gugus galaksi di belahan langit selatan, bagian dari Supergugus Hydra–Centaurus di dalam Laniakea.',
 'Galaxy cluster',[['Distance','~160 million light-years'],['Catalog name','Abell 1060']],'A galaxy cluster in the southern sky, part of the Hydra–Centaurus Supercluster within Laniakea.'),
'Gugus Centaurus':I('Gugus galaksi',[['Jarak','~170 juta tahun cahaya'],['Nama katalog','Abell 3526']],'Gugus galaksi kaya di rasi Centaurus, salah satu simpul utama Supergugus Hydra–Centaurus.',
 'Galaxy cluster',[['Distance','~170 million light-years'],['Catalog name','Abell 3526']],'A rich galaxy cluster in Centaurus, one of the main nodes of the Hydra–Centaurus Supercluster.'),
'Gugus Norma, dekat Great Attractor':I('Gugus galaksi',[['Jarak','~220 juta tahun cahaya'],['Nama katalog','Abell 3627']],'Gugus masif di dekat Great Attractor, wilayah yang menarik ribuan galaksi termasuk Local Group. Letaknya di balik piringan Bima Sakti (Zona Penghalang), sehingga debu galaksi kita menyulitkan pengamatannya.',
 'Galaxy cluster',[['Distance','~220 million light-years'],['Catalog name','Abell 3627']],'A massive cluster near the Great Attractor, the region pulling on thousands of galaxies, the Local Group included. It lies behind the disk of the Milky Way (the Zone of Avoidance), so our galaxy’s dust makes it hard to observe.'),
'Supergugus Perseus–Pisces':I('Supergugus',[['Jarak','~250 juta tahun cahaya'],['Letak','di luar Laniakea']],'Salah satu struktur besar terdekat di luar Laniakea. Antara kita dan Perseus–Pisces terbentang Local Void, wilayah luas yang hampir kosong dari galaksi.',
 'Supercluster',[['Distance','~250 million light-years'],['Location','outside Laniakea']],'One of the nearest large structures outside Laniakea. Between us and Perseus–Pisces stretches the Local Void, a vast region almost empty of galaxies.'),
'Gugus Coma':I('Gugus galaksi',[['Jarak','~320 juta tahun cahaya'],['Anggota','lebih dari 1.000 galaksi']],'Pada 1933, Fritz Zwicky mengukur kecepatan galaksi di Gugus Coma dan mendapati galaksinya bergerak terlalu cepat untuk ditahan massa yang terlihat. Inilah salah satu petunjuk pertama keberadaan materi gelap.',
 'Galaxy cluster',[['Distance','~320 million light-years'],['Members','more than 1,000 galaxies']],'In 1933, Fritz Zwicky measured the speeds of galaxies in the Coma Cluster and found them moving too fast to be held together by the visible mass. It was one of the first clues to the existence of dark matter.'),
'Batas Laniakea':I('Supergugus',[['Diameter','~520 juta tahun cahaya'],['Galaksi','~100.000'],['Massa','~10¹⁷ × Matahari']],'Laniakea tidak didefinisikan dari batas yang tampak, tapi dari arah gerak galaksi. Semua galaksi di dalam batas ini mengalir menuju pusat gravitasi yang sama, seperti air dalam satu daerah aliran sungai. Bentuk di layar adalah ilustrasi.',
 'Supercluster',[['Diameter','~520 million light-years'],['Galaxies','~100,000'],['Mass','~10¹⁷ × Sun']],'Laniakea is defined not by a visible edge but by how galaxies move. Every galaxy inside the boundary flows toward the same center of gravity, like water within one river basin. The shape on screen is illustrative.'),
'Kita':I('Posisi pengamat',[['Posisi','pusat alam semesta teramati kita sendiri']],'Kita berada di pusat bukan karena istimewa. Alam semesta teramati adalah bola berisi semua cahaya yang sempat sampai ke kita sejak Big Bang, jadi setiap pengamat, di galaksi mana pun, berada di pusat bolanya sendiri.',
 'Observer’s position',[['Position','center of our own observable universe']],'We are at the center not because we are special. The observable universe is the sphere of all the light that has had time to reach us since the Big Bang, so every observer, in any galaxy, sits at the center of their own sphere.'),
'Batas alam semesta teramati':I('Batas pengamatan',[['Jari-jari','~46,5 miliar tahun cahaya'],['Umur alam semesta','~13,8 miliar tahun']],'Ini bukan dinding. Ini batas sejauh mana cahaya sempat menempuh perjalanan ke kita. Alam semesta kemungkinan jauh lebih besar, bahkan mungkin tak terhingga, tapi bagian di luar batas ini belum bisa kita lihat.',
 'Limit of observation',[['Radius','~46.5 billion light-years'],['Age of the universe','~13.8 billion years']],'This is not a wall. It is the limit of how far light has had time to travel to us. The universe is probably much larger, perhaps infinite, but we cannot see beyond this boundary.'),
'Cahaya latar belakang kosmik':I('Radiasi tertua',[['Dipancarkan','~380.000 tahun setelah Big Bang'],['Suhu sekarang','2,725 K (−270,4 °C)'],['Ditemukan','1965, Penzias & Wilson']],'Saat alam semesta cukup dingin untuk membentuk atom, cahaya akhirnya bisa melintas bebas. Cahaya itu masih sampai ke kita sekarang dari segala arah, teregang oleh pengembangan ruang menjadi gelombang mikro. Penemunya meraih Nobel Fisika 1978.',
 'Oldest light',[['Emitted','~380,000 years after the Big Bang'],['Temperature today','2.725 K (−270.4 °C)'],['Discovered','1965, Penzias & Wilson']],'Once the universe cooled enough for atoms to form, light could finally travel freely. That light still reaches us from every direction, stretched into microwaves by the expansion of space. Its discoverers won the 1978 Nobel Prize in Physics.')
};
return{NAMES,TITLE_ID,TITLE_EN,UI,LEVELS,BODY,INFO};
})();

<script>
window.CONTENT2=(()=>{
const N='https://science.nasa.gov', W='https://en.wikipedia.org/wiki/', M=n=>`${N}/mission/hubble/science/explore-the-night-sky/hubble-messier-catalog/messier-${n}/`;
const nasa=(p,t)=>[t||'NASA Science',N+p], wiki=(p,t)=>[t||'Wikipedia',W+p], mess=n=>[`NASA · Messier ${n}`,M(n)];
const X=(xi,xe)=>({id:xi,en:xe});

/* ---------- additions to existing objects: fun facts, image, references ---------- */
const EXTRA={
'Matahari':{img:'tex/sun.jpg',cap:'Solar System Scope (CC BY 4.0), berbasis data NASA',x:X(['Energi dari inti butuh puluhan ribu tahun untuk merambat ke permukaan, tapi setelah lepas hanya perlu 8 menit 20 detik untuk sampai ke Bumi.','Setiap detik, Matahari mengubah sekitar 4 juta ton massanya menjadi energi.'],['Energy from the core takes tens of thousands of years to work its way to the surface, but once free it reaches Earth in 8 minutes 20 seconds.','Every second, the Sun converts about 4 million tonnes of its mass into energy.']),refs:[nasa('/sun/'),wiki('Sun')]},
'Merkurius':{img:'tex/mercury.jpg',cap:'NASA/JHUAPL/Carnegie Institution (MESSENGER)',x:X(['Walau terdekat ke Matahari, kawah di kutubnya yang selalu gelap menyimpan es air, seperti ditemukan wahana MESSENGER.','Dirata-rata sepanjang waktu, Merkurius adalah planet yang paling dekat dengan setiap planet lain, termasuk Bumi.'],['Despite being closest to the Sun, permanently shadowed craters at its poles hold water ice, as the MESSENGER spacecraft found.','Averaged over time, Mercury is the closest planet to every other planet, including Earth.']),refs:[nasa('/mercury/'),wiki('Mercury_(planet)')]},
'Venus':{img:'tex/venus.jpg',cap:'Solar System Scope (CC BY 4.0), lapisan awan',x:X(['Ekuator Venus berputar sekitar 6,5 km/jam, sedikit lebih lambat dari orang yang berlari kecil.','Wahana Venera 13 (1982) hanya bertahan 127 menit di permukaannya sebelum rusak oleh panas dan tekanan.'],['Venus’s equator turns at about 6.5 km/h, slower than a person jogging.','The Venera 13 lander (1982) survived only 127 minutes on the surface before heat and pressure destroyed it.']),refs:[nasa('/venus/'),wiki('Venus')]},
'Bumi':{img:'tex/earth_day.jpg',cap:'Peta permukaan berbasis citra NASA Blue Marble',x:X(['Bumi tidak bulat sempurna: diameter ekuatornya sekitar 43 km lebih besar daripada diameter antarkutub.','Jika Bumi sebesar apel, lapisan atmosfer yang bisa kita hirup lebih tipis dari kulit apel itu.'],['Earth is not a perfect sphere: its equatorial diameter is about 43 km larger than its pole-to-pole diameter.','If Earth were the size of an apple, the breathable layer of the atmosphere would be thinner than the apple’s skin.']),refs:[nasa('/earth/'),wiki('Earth')]},
'Mars':{img:'img/olympus-mons.jpg',cap:'Olympus Mons · NASA/JPL (Viking 1)',x:X(['Langit Mars berwarna kemerahan di siang hari, tapi matahari terbenamnya justru kebiruan karena debu halus menghamburkan cahaya biru ke arah depan.','Helikopter Ingenuity, yang dibawa rover Perseverance, melakukan penerbangan bertenaga pertama di planet lain pada April 2021.'],['The Martian sky is reddish by day, but sunsets are bluish because fine dust scatters blue light forward.','The Ingenuity helicopter, carried by the Perseverance rover, made the first powered flight on another planet in April 2021.']),refs:[nasa('/mars/'),wiki('Mars')]},
'Jupiter':{img:'img/great-red-spot.jpg',cap:'Bintik Merah Raksasa · NASA/JPL-Caltech (Juno)',x:X(['Bintik Merah Raksasa cukup lebar untuk menelan seluruh Bumi.','Pada Juli 1994, lebih dari 20 pecahan Komet Shoemaker–Levy 9 menghantam Jupiter. Bekas tumbukannya, sebagian lebih besar dari Bumi, terlihat berbulan-bulan.'],['The Great Red Spot is wide enough to swallow the whole Earth.','In July 1994, more than 20 fragments of Comet Shoemaker–Levy 9 slammed into Jupiter. The scars, some larger than Earth, stayed visible for months.']),refs:[nasa('/jupiter/'),wiki('Comet_Shoemaker–Levy_9','Wikipedia · Shoemaker–Levy 9')]},
'Saturnus':{img:'img/saturn-hexagon.jpg',cap:'Badai heksagonal kutub utara · NASA/JPL-Caltech/SSI (Cassini)',x:X(['Di kutub utaranya berputar badai berbentuk segi enam yang lebarnya lebih dari dua kali Bumi.','Usia cincinnya masih diperdebatkan; sebagian data Cassini mengisyaratkan cincin ini mungkin baru berumur beberapa ratus juta tahun.'],['A six-sided storm, more than twice as wide as Earth, spins around its north pole.','The age of the rings is still debated; some Cassini data suggest they may be only a few hundred million years old.']),refs:[nasa('/saturn/'),wiki('Saturn')]},
'Uranus':{img:'tex/uranus.jpg',cap:'Solar System Scope (CC BY 4.0)',x:X(['Uranus adalah planet pertama yang ditemukan dengan teleskop, oleh William Herschel pada 1781.','Warnanya biru kehijauan karena metana di atmosfernya menyerap cahaya merah.'],['Uranus was the first planet discovered with a telescope, by William Herschel in 1781.','Its blue-green color comes from methane in its atmosphere absorbing red light.']),refs:[nasa('/uranus/'),wiki('Uranus')]},
'Neptunus':{img:'img/great-dark-spot.jpg',cap:'Bintik Gelap Raksasa · NASA/JPL (Voyager 2, 1989)',x:X(['Voyager 2 memotret Bintik Gelap Raksasa pada 1989, badai seukuran Bumi yang beberapa tahun kemudian menghilang.','Sejak ditemukan pada 1846, Neptunus baru menyelesaikan satu putaran penuh mengelilingi Matahari pada 2011.'],['Voyager 2 photographed the Great Dark Spot in 1989, an Earth-sized storm that later vanished.','Since its discovery in 1846, Neptune completed its first full orbit of the Sun only in 2011.']),refs:[nasa('/neptune/'),wiki('Neptune')]},
'Pluto':{x:X(['Bulannya, Charon, berukuran sekitar setengah Pluto, sehingga keduanya mengorbit titik di ruang kosong di antara mereka.','Sebagian abu Clyde Tombaugh, penemu Pluto, ikut terbang di dalam wahana New Horizons.'],['Its moon Charon is about half Pluto’s size, so the two orbit a point in empty space between them.','Some of the ashes of Clyde Tombaugh, who discovered Pluto, are flying aboard New Horizons.']),refs:[nasa('/dwarf-planets/pluto/'),wiki('Pluto')]},
'Bulan':{img:'img/apollo-11-landing.jpg',cap:'Buzz Aldrin di Bulan · NASA (Apollo 11, 1969)',x:X(['Dua belas orang pernah berjalan di Bulan, semuanya antara 1969 dan 1972.','Bulan kemungkinan terbentuk dari puing tabrakan raksasa antara Bumi muda dan benda seukuran Mars yang dinamai Theia.'],['Twelve people have walked on the Moon, all between 1969 and 1972.','The Moon probably formed from debris of a giant collision between the young Earth and a Mars-sized body called Theia.']),refs:[nasa('/moon/'),wiki('Moon')]},
'Phobos':{x:X(['Phobos punya kawah raksasa bernama Stickney, yang lebarnya hampir separuh bulan itu sendiri.'],['Phobos has a giant crater called Stickney, nearly half as wide as the moon itself.']),refs:[nasa('/mars/moons/phobos/'),wiki('Phobos_(moon)')]},
'Deimos':{x:X(['Phobos dan Deimos ditemukan Asaph Hall pada 1877. Nama mereka berarti "ketakutan" dan "kengerian".'],['Phobos and Deimos were discovered by Asaph Hall in 1877. Their names mean "fear" and "dread".']),refs:[nasa('/mars/moons/deimos/'),wiki('Deimos_(moon)')]},
'Io':{img:'tex/io.jpg',cap:'Peta permukaan berbasis data NASA (Galileo/Voyager)',x:X(['Danau lava Loki Patera di Io lebih luas dari Pulau Bali.','Gunung api Io bisa menyemburkan material hingga ratusan kilometer di atas permukaannya.'],['Io’s lava lake Loki Patera covers a larger area than the island of Bali.','Io’s volcanoes can hurl material hundreds of kilometers above the surface.']),refs:[nasa('/jupiter/jupiter-moons/io/'),wiki('Io_(moon)')]},
'Europa':{img:'tex/europa.jpg',cap:'Peta permukaan berbasis data NASA (Galileo/Voyager)',x:X(['Teleskop Hubble pernah melihat tanda-tanda semburan uap air dari permukaannya.','Retakan kecoklatan di permukaannya diduga berisi garam dari lautan di bawah es.'],['The Hubble Space Telescope has seen signs of water-vapor plumes rising from its surface.','The brownish cracks on its surface may contain salts from the ocean below the ice.']),refs:[nasa('/jupiter/jupiter-moons/europa/'),wiki('Europa_(moon)')]},
'Ganymede':{img:'tex/ganymede.jpg',cap:'Peta permukaan berbasis data NASA',x:X(['Ganymede lebih besar dari Merkurius, tapi massanya kurang dari setengah massa Merkurius, karena banyak tersusun dari es.'],['Ganymede is larger than Mercury but has less than half its mass, because it is largely made of ice.']),refs:[nasa('/jupiter/jupiter-moons/ganymede/'),wiki('Ganymede_(moon)')]},
'Callisto':{img:'tex/callisto.jpg',cap:'Peta permukaan berbasis data NASA',x:X(['Karena jauh dari sabuk radiasi Jupiter yang mematikan, Callisto pernah diusulkan NASA sebagai lokasi pangkalan manusia untuk menjelajahi sistem Jupiter.'],['Because it lies outside Jupiter’s deadly radiation belts, NASA studies have proposed Callisto as a site for a human base to explore the Jupiter system.']),refs:[nasa('/jupiter/jupiter-moons/callisto/'),wiki('Callisto_(moon)')]},
'Enceladus':{x:X(['Permukaannya memantulkan hampir semua cahaya Matahari, menjadikannya salah satu benda paling terang di tata surya.'],['Its surface reflects almost all the sunlight that hits it, making it one of the brightest objects in the solar system.']),refs:[nasa('/saturn/moons/enceladus/'),wiki('Enceladus')]},
'Rhea':{x:X(['Cassini mendeteksi atmosfer sangat tipis berisi oksigen dan karbon dioksida di sekitar Rhea.'],['Cassini detected a very thin atmosphere of oxygen and carbon dioxide around Rhea.']),refs:[nasa('/saturn/moons/rhea/'),wiki('Rhea_(moon)')]},
'Titan':{img:'tex/titan.jpg',cap:'Peta permukaan berbasis data NASA/ESA (Cassini–Huygens)',x:X(['Titan lebih besar dari planet Merkurius.','Karena gravitasinya rendah dan atmosfernya tebal, manusia di Titan secara teori bisa terbang hanya dengan sayap yang diikat di lengan.'],['Titan is larger than the planet Mercury.','With low gravity and a thick atmosphere, a person on Titan could in principle fly with wings strapped to their arms.']),refs:[nasa('/saturn/moons/titan/'),wiki('Titan_(moon)')]},
'Iapetus':{x:X(['Giovanni Cassini menemukannya pada 1671 dan heran karena bulan ini hanya terlihat di satu sisi orbitnya. Penyebabnya adalah belahan gelapnya.'],['Giovanni Cassini discovered it in 1671 and was puzzled that it was visible on only one side of its orbit. Its dark hemisphere was the reason.']),refs:[nasa('/saturn/moons/iapetus/'),wiki('Iapetus_(moon)')]},
'Sabuk asteroid':{x:X(['Wahana Dawn mengorbit dua anggota terbesarnya: Vesta (2011–2012) dan Ceres (2015–2018).'],['The Dawn spacecraft orbited its two largest members: Vesta (2011–2012) and Ceres (2015–2018).']),refs:[nasa('/solar-system/asteroids/'),wiki('Asteroid_belt')]},
'Trojan':{x:X(['Nama-nama Trojan Jupiter diambil dari tokoh Perang Troya: kelompok L4 dinamai pahlawan Yunani, kelompok L5 dinamai pahlawan Troya.'],['Jupiter’s Trojans are named after figures of the Trojan War: the L4 group after Greek heroes, the L5 group after Trojan heroes.']),refs:[nasa('/mission/lucy/','NASA · Lucy'),wiki('Jupiter_trojan')]},
'Sabuk Kuiper':{x:X(['Pluto bukan satu-satunya: Sabuk Kuiper diperkirakan berisi ratusan ribu benda es yang lebih besar dari 100 km.'],['Pluto is not alone: the Kuiper Belt is thought to hold hundreds of thousands of icy bodies larger than 100 km.']),refs:[nasa('/solar-system/kuiper-belt/'),wiki('Kuiper_belt')]},
'Voyager 1':{x:X(['Sinyal radionya kini butuh hampir satu hari penuh untuk sampai ke Bumi.','Pemancarnya berdaya sekitar 23 watt, kira-kira setara lampu kulkas.'],['Its radio signals now take almost a full day to reach Earth.','Its transmitter runs on about 23 watts, roughly a refrigerator light bulb.']),refs:[nasa('/mission/voyager/voyager-1/'),wiki('Voyager_1')]},
'Heliopause':{x:X(['Heliosfer membantu melindungi tata surya dari sebagian sinar kosmik galaksi yang berenergi tinggi.'],['The heliosphere helps shield the solar system from part of the high-energy galactic cosmic rays.']),refs:[wiki('Heliosphere')]},

 [['Gravitasi di permukaannya begitu kuat sehingga cahaya pun "melengkung", membuat kita bisa melihat sebagian sisi belakangnya.'],['Its surface gravity is so strong that light bends around it, letting us see part of its far side.']],{refs:[wiki('RX_J1856.5−3754')],view:17.6}),
'Gaia BH1':O('rem',{eq:[262.17,-0.58,1560]},['Lubang hitam','Black hole'],[[['Jarak','~1.560 tahun cahaya'],['Massa','~9,6 × Matahari'],['Ditemukan','2022']],[['Distance','~1,560 light-years'],['Mass','~9.6 × Sun'],['Discovered','2022']]],
 ['Lubang hitam terdekat yang diketahui. Ia "diam": tidak menelan materi dan tidak memancarkan sinar-X. Keberadaannya diketahui dari goyangan sebuah bintang mirip Matahari yang mengorbitnya, diukur oleh satelit Gaia.','The nearest known black hole. It is "dormant": not feeding on matter and not shining in X-rays. It was found from the wobble of a Sun-like star orbiting it, measured by the Gaia satellite.'],
 [['Lubang hitam terbentuk ketika inti bintang yang sangat masif runtuh; gravitasinya begitu kuat sehingga cahaya pun tidak bisa lolos.'],['Black holes form when the core of a very massive star collapses; their gravity is so strong that not even light can escape.']],{refs:[wiki('Gaia_BH1'),nasa('/universe/black-holes/','NASA · Black holes')],view:18.0}),
'Gaia BH3':O('rem',{eq:[294.83,14.93,1926]},['Lubang hitam','Black hole'],[[['Jarak','~1.930 tahun cahaya'],['Massa','~33 × Matahari'],['Ditemukan','2024']],[['Distance','~1,930 light-years'],['Mass','~33 × Sun'],['Discovered','2024']]],
 ['Lubang hitam bintang paling masif yang diketahui di Bima Sakti. Seperti Gaia BH1, ia ditemukan dari gerak bintang pendampingnya, sebuah bintang tua yang miskin logam.','The most massive stellar black hole known in the Milky Way. Like Gaia BH1, it was found from the motion of its companion, an old, metal-poor star.'],
 [['Ditemukan secara tak sengaja saat tim Gaia memeriksa data sebelum rilis resmi.'],['It was found by chance while the Gaia team was checking data ahead of an official release.']],{refs:[wiki('Gaia_BH3'),nasa('/universe/black-holes/','NASA · Black holes')],view:18.0}),
'Cygnus X-1':O('rem',{eq:[299.59,35.20,7200]},['Lubang hitam','Black hole'],[[['Jarak','~7.200 tahun cahaya'],['Massa','~21 × Matahari']],[['Distance','~7,200 light-years'],['Mass','~21 × Sun']]],
 ['Salah satu sumber sinar-X paling terang di langit dan lubang hitam pertama yang diterima luas keberadaannya. Ia menyedot gas dari bintang raksasa biru pendampingnya; gas yang berputar dan memanas itu memancarkan sinar-X.','One of the brightest X-ray sources in the sky and the first black hole widely accepted as real. It pulls gas from its blue supergiant companion; the swirling, superheated gas shines in X-rays.'],
 [['Pada 1974, Stephen Hawking bertaruh dengan Kip Thorne bahwa Cygnus X-1 bukan lubang hitam. Hawking mengaku kalah pada 1990.'],['In 1974 Stephen Hawking bet Kip Thorne that Cygnus X-1 was not a black hole. Hawking conceded in 1990.']],{refs:[wiki('Cygnus_X-1')],view:18.4}),
'Cassiopeia A':O('rem',{eq:[350.85,58.81,11000]},['Sisa supernova','Supernova remnant'],[[['Jarak','~11.000 tahun cahaya'],['Cahaya ledakan tiba','sekitar 1680-an']],[['Distance','~11,000 light-years'],['Explosion light arrived','around the 1680s']]],
 ['Sisa supernova termuda yang diketahui di Bima Sakti. Cahaya ledakannya seharusnya sampai ke Bumi sekitar 340 tahun lalu, tapi hampir tidak ada catatan pengamatannya, mungkin karena tertutup debu. Di pusatnya ada bintang neutron yang ditemukan teleskop sinar-X Chandra pada 1999.','The youngest known supernova remnant in the Milky Way. Its light should have reached Earth about 340 years ago, yet there are almost no records of it, perhaps because dust dimmed it. At the center is a neutron star found by the Chandra X-ray telescope in 1999.'],
 [['Ledakan seperti ini menyebarkan unsur seperti besi, kalsium, dan oksigen ke galaksi. Sebagian atom di tubuh kita berasal dari bintang yang meledak.'],['Explosions like this scatter elements such as iron, calcium and oxygen through the galaxy. Some atoms in your body came from exploded stars.']],{photo:'casa',img:'img/casa.jpg',cap:'Foto: Adam Block/Mount Lemmon SkyCenter (via Stellarium)',refs:[wiki('Cassiopeia_A')],view:18.8}),
'Vela':O('rem',{eq:[128.84,-45.18,900]},['Sisa supernova + pulsar','Supernova remnant + pulsar'],[[['Jarak','~800–960 tahun cahaya'],['Ledakan','~11.000–12.300 tahun lalu'],['Pulsar','berputar ~11 kali per detik']],[['Distance','~800–960 light-years'],['Explosion','~11,000–12,300 years ago'],['Pulsar','spins ~11 times per second']]],
 ['Sisa supernova yang meledak saat manusia sudah ada di Bumi. Cahayanya mungkin terlihat terang oleh manusia prasejarah. Pusatnya kini ditempati Pulsar Vela, bintang neutron yang berputar sangat cepat dan kadang tiba-tiba "tersentak" berputar lebih cepat (glitch).','A supernova that exploded when humans were already on Earth; prehistoric people may have seen it shine brightly. At its center is the Vela Pulsar, a rapidly spinning neutron star that occasionally speeds up abruptly in a "glitch".'],
 [['Awan sisa ledakannya kini terbentang lebih dari 8 kali lebar Bulan purnama di langit.'],['Its debris cloud now spans more than 8 times the width of the full Moon in the sky.']],{photo:'velasnr',img:'img/velasnr.jpg',cap:'Foto: Manuel Peitsch, olah: Sun Shuwei (via Stellarium)',refs:[wiki('Vela_Supernova_Remnant'),wiki('Vela_Pulsar','Wikipedia · Vela Pulsar')],view:19.0}),
/* exoplanets */
'TRAPPIST-1':O('exo',{eq:[346.62,-5.04,40.7]},['Sistem eksoplanet','Exoplanet system'],[[['Jarak','~40,7 tahun cahaya'],['Planet','7, seukuran Bumi'],['Diumumkan','2017']],[['Distance','~40.7 light-years'],['Planets','7, Earth-sized'],['Announced','2017']]],
 ['Bintang katai merah kecil yang dikelilingi tujuh planet batuan seukuran Bumi, beberapa di antaranya berada di zona laik huni, wilayah tempat air cair mungkin ada. Seluruh sistem ini muat di dalam orbit Merkurius.','A small red dwarf orbited by seven rocky, Earth-sized planets, several in the habitable zone where liquid water might exist. The whole system would fit inside Mercury’s orbit.'],
 [['Dari permukaan satu planet TRAPPIST-1, planet tetangganya bisa tampak lebih besar dari Bulan di langit kita.'],['From the surface of one TRAPPIST-1 planet, its neighbors could look larger than our Moon does in our sky.']],{refs:[wiki('TRAPPIST-1'),nasa('/exoplanets/','NASA · Exoplanets')],view:16.6}),
'51 Pegasi':O('exo',{eq:[344.37,20.77,50.6]},['Sistem eksoplanet','Exoplanet system'],[[['Jarak','~50,6 tahun cahaya'],['Planet','51 Pegasi b (1995)'],['Satu tahun planet','4,2 hari']],[['Distance','~50.6 light-years'],['Planet','51 Pegasi b (1995)'],['Planet’s year','4.2 days']]],
 ['Bintang mirip Matahari pertama yang diketahui punya planet. Planetnya, 51 Pegasi b, adalah "Jupiter panas": raksasa gas yang mengorbit sangat dekat dengan bintangnya. Penemuan ini mengubah pandangan kita tentang bentuk tata surya lain.','The first Sun-like star known to host a planet. Its planet, 51 Pegasi b, is a "hot Jupiter": a gas giant orbiting extremely close to its star. The discovery overturned ideas about what other solar systems look like.'],
 [['Penemunya, Michel Mayor dan Didier Queloz, meraih Nobel Fisika 2019.'],['Its discoverers, Michel Mayor and Didier Queloz, won the 2019 Nobel Prize in Physics.']],{refs:[wiki('51_Pegasi_b'),nasa('/exoplanets/','NASA · Exoplanets')],view:16.8}),
'Kepler-186':O('exo',{eq:[298.65,43.95,580]},['Sistem eksoplanet','Exoplanet system'],[[['Jarak','~580 tahun cahaya'],['Planet terkenal','Kepler-186f (2014)']],[['Distance','~580 light-years'],['Notable planet','Kepler-186f (2014)']]],
 ['Rumah Kepler-186f, planet seukuran Bumi pertama yang ditemukan di zona laik huni bintang lain. Teleskop antariksa Kepler menemukannya dengan mengamati bintangnya sedikit meredup setiap kali planet itu lewat di depannya.','Home of Kepler-186f, the first Earth-sized planet found in another star’s habitable zone. The Kepler space telescope found it by watching the star dim slightly each time the planet passed in front of it.'],
 [['Teleskop Kepler menemukan lebih dari 2.600 eksoplanet terkonfirmasi selama misinya.'],['The Kepler telescope found more than 2,600 confirmed exoplanets during its mission.']],{refs:[wiki('Kepler-186f'),nasa('/exoplanets/','NASA · Exoplanets')],view:17.6}),
/* far phenomena */
'SN 1987A':O('rem',{eq:[83.87,-69.27,168000]},['Supernova','Supernova'],[[['Jarak','~168.000 tahun cahaya'],['Lokasi','Awan Magellan Besar'],['Teramati','24 Februari 1987']],[['Distance','~168,000 light-years'],['Location','Large Magellanic Cloud'],['Observed','February 24, 1987']]],
 ['Supernova terdekat yang teramati sejak teleskop ditemukan. Beberapa jam sebelum cahayanya terlihat, detektor di Bumi menangkap ledakan neutrino dari keruntuhan intinya, pertama kalinya neutrino dari supernova terdeteksi. Pada 2024, Webb menemukan bukti adanya bintang neutron di pusatnya.','The nearest supernova observed since the invention of the telescope. Hours before its light appeared, detectors on Earth caught a burst of neutrinos from its collapsing core, the first neutrinos ever detected from a supernova. In 2024, Webb found evidence of a neutron star at its center.'],
 [['Ledakan itu sebenarnya terjadi sekitar 168.000 tahun lalu; cahayanya baru tiba pada 1987.'],['The explosion actually happened about 168,000 years ago; its light only arrived in 1987.']],{refs:[wiki('SN_1987A')],view:21.6}),
'Galaksi Pusaran Air':O('gal',{eq:[202.47,47.20,31e6]},['Galaksi spiral','Spiral galaxy'],[[['Jarak','~31 juta tahun cahaya'],['Nama katalog','Messier 51']],[['Distance','~31 million light-years'],['Catalog name','Messier 51']]],
 ['Galaksi spiral yang sedang "berdansa" dengan galaksi kecil NGC 5195 di ujung salah satu lengannya. Tarikan gravitasi galaksi kecil itulah yang diduga mempertegas lengan spiralnya.','A spiral galaxy "dancing" with the small galaxy NGC 5195 at the tip of one arm. The smaller galaxy’s gravitational pull is thought to sharpen its spiral arms.'],
 [['Pada 1845, Lord Rosse menggambar M51 dan menjadi orang pertama yang mengenali struktur spiral pada sebuah "nebula".'],['In 1845 Lord Rosse sketched M51, becoming the first to recognize spiral structure in a "nebula".']],{photo:'m51',img:'img/m51.jpg',cap:'Foto: Plover Hill Observatory (via Stellarium)',refs:[mess(51),wiki('Whirlpool_Galaxy')],view:23.6}),
'Galaksi Sombrero':O('gal',{eq:[190.00,-11.62,28e6]},['Galaksi','Galaxy'],[[['Jarak','~28 juta tahun cahaya'],['Nama katalog','Messier 104']],[['Distance','~28 million light-years'],['Catalog name','Messier 104']]],
 ['Galaksi dengan tonjolan pusat besar dan lajur debu gelap yang tajam, sehingga mirip topi sombrero Meksiko. Di pusatnya ada lubang hitam bermassa sekitar satu miliar kali Matahari.','A galaxy with a large central bulge and a sharp, dark dust lane that makes it look like a Mexican sombrero. At its center is a black hole of about a billion solar masses.'],
 [['Kita melihatnya hampir tepat dari samping, sekitar 6° dari bidang piringannya.'],['We see it almost edge-on, about 6° from the plane of its disk.']],{photo:'m104',img:'img/m104.jpg',cap:'Foto: Adam Block/Mount Lemmon SkyCenter (via Stellarium)',refs:[mess(104),wiki('Sombrero_Galaxy')],view:23.5}),
'M87':O('gal',{eq:[187.71,12.39,53.5e6]},['Galaksi elips raksasa','Giant elliptical galaxy'],[[['Jarak','~53,5 juta tahun cahaya'],['Lubang hitam pusat','~6,5 miliar × Matahari']],[['Distance','~53.5 million light-years'],['Central black hole','~6.5 billion × Sun']]],
 ['Galaksi raksasa di pusat Gugus Virgo. Lubang hitam di pusatnya, M87*, adalah lubang hitam pertama yang berhasil dicitrakan, oleh Event Horizon Telescope pada 2019. Dari pusatnya menyembur jet partikel sepanjang sekitar 5.000 tahun cahaya dengan kecepatan mendekati cahaya.','A giant galaxy at the heart of the Virgo Cluster. Its central black hole, M87*, was the first black hole ever imaged, by the Event Horizon Telescope in 2019. A jet of particles about 5,000 light-years long shoots out of its core at nearly the speed of light.'],
 [['M87 diperkirakan memiliki sekitar 12.000 gugus bintang bola, jauh lebih banyak dari Bima Sakti yang punya sekitar 150.'],['M87 has an estimated 12,000 globular clusters, far more than the Milky Way’s roughly 150.']],{refs:[mess(87),wiki('Messier_87')],view:23.8}),
'Centaurus A':O('gal',{eq:[201.37,-43.02,12e6]},['Galaksi radio','Radio galaxy'],[[['Jarak','~12 juta tahun cahaya'],['Nama katalog','NGC 5128']],[['Distance','~12 million light-years'],['Catalog name','NGC 5128']]],
 ['Galaksi radio terdekat dari Bumi. Lajur debu gelap yang melintanginya adalah sisa tabrakan dengan galaksi spiral di masa lalu. Lubang hitam supermasif di pusatnya menyemburkan jet yang membentang ratusan ribu tahun cahaya.','The nearest radio galaxy to Earth. The dark dust lane across it is left over from a past collision with a spiral galaxy. Its central supermassive black hole launches jets stretching hundreds of thousands of light-years.'],
 [['Dengan teropong binokuler dari langit selatan yang gelap, ia tampak sebagai bercak samar dengan garis gelap di tengah.'],['With binoculars under dark southern skies it appears as a faint smudge crossed by a dark band.']],{refs:[wiki('Centaurus_A')],view:22.8}),
'GW170817':O('gal',{eq:[197.45,-23.38,130e6]},['Tabrakan bintang neutron','Neutron star merger'],[[['Jarak','~130 juta tahun cahaya'],['Galaksi','NGC 4993'],['Terdeteksi','17 Agustus 2017']],[['Distance','~130 million light-years'],['Galaxy','NGC 4993'],['Detected','August 17, 2017']]],
 ['Untuk pertama kalinya, tabrakan dua bintang neutron "didengar" sebagai gelombang gravitasi dan sekaligus dilihat sebagai cahaya (kilonova) oleh puluhan observatorium. Pengamatan ini membuktikan bahwa tabrakan semacam ini menghasilkan unsur berat seperti emas dan platinum.','For the first time, a collision of two neutron stars was "heard" as gravitational waves and seen as light (a kilonova) by dozens of observatories. It showed that such collisions forge heavy elements like gold and platinum.'],
 [['Sebagian emas di perhiasan di Bumi kemungkinan besar terbentuk dari peristiwa seperti ini.'],['Some of the gold in jewelry on Earth very likely formed in events like this.']],{refs:[wiki('GW170817')],view:24.0}),
'3C 273':O('gal',{eq:[187.28,2.05,2.1e9]},['Quasar','Quasar'],[[['Cahaya berangkat','~2,4 miliar tahun lalu'],['Diidentifikasi','1963']],[['Light left','~2.4 billion years ago'],['Identified','1963']]],
 ['Quasar pertama yang diidentifikasi, oleh Maarten Schmidt pada 1963. Quasar adalah inti galaksi yang sangat terang karena lubang hitam supermasifnya sedang lahap menelan materi. 3C 273 memancarkan cahaya ribuan kali lebih banyak dari seluruh Bima Sakti.','The first quasar ever identified, by Maarten Schmidt in 1963. A quasar is a galaxy core blazing because its supermassive black hole is feeding voraciously. 3C 273 outshines the entire Milky Way thousands of times over.'],
 [['Walau sangat jauh, quasar ini bisa dilihat dengan teleskop amatir berukuran sedang.'],['Despite its distance, it can be seen with a mid-sized amateur telescope.']],{refs:[wiki('3C_273')],view:25.8}),
'JADES-GS-z14-0':O('gal',{eq:[53.08,-27.86,33.8e9]},['Galaksi sangat jauh','Extremely distant galaxy'],[[['Cahaya berangkat','~290 juta tahun setelah Big Bang'],['Diumumkan','2024, oleh Webb']],[['Light left','~290 million years after the Big Bang'],['Announced','2024, by Webb']]],
 ['Salah satu galaksi terjauh yang jaraknya sudah terkonfirmasi. Cahaya yang ditangkap Webb berangkat saat alam semesta baru berumur sekitar 2% dari umurnya sekarang. Galaksi ini ternyata lebih terang dan lebih besar dari perkiraan, sehingga para ilmuwan memikirkan ulang cara galaksi pertama terbentuk.','One of the most distant galaxies with a confirmed distance. The light Webb captured left when the universe was about 2% of its current age. The galaxy turned out brighter and larger than expected, prompting rethinking of how the first galaxies formed.'],
 [['Rekor galaksi terjauh terus diperbarui; pada 2025 dilaporkan galaksi yang sedikit lebih jauh lagi.','Letaknya di arah yang sama dengan Hubble Ultra Deep Field, foto langit terdalam era Hubble.'],['The record keeps being broken; in 2025 a slightly more distant galaxy was reported.','It lies in the same direction as the Hubble Ultra Deep Field, Hubble’s deepest view of the sky.']],{refs:[wiki('JADES-GS-z14-0'),nasa('/mission/webb/','NASA · Webb')],view:26.4}),
/* small bodies (orbits) */
'Komet Halley':O('sml',{orbit:{q:.5860,e:.96714,i:162.26,O:58.42,w:111.33,Tp:'1986-02-09T11:00Z'}},['Komet','Comet'],[[['Periode','~76 tahun'],['Kemunculan terakhir','1986'],['Berikutnya','2061']],[['Period','~76 years'],['Last appearance','1986'],['Next','2061']]],
 ['Komet paling terkenal dan satu-satunya komet periode pendek yang terang dan bisa terlihat mata telanjang dua kali dalam satu umur manusia. Edmond Halley menghitung pada 1705 bahwa komet-komet yang terlihat pada 1531, 1607, dan 1682 adalah satu objek yang sama, dan meramalkan kembalinya pada 1758. Ramalannya terbukti.','The most famous comet, and the only bright short-period comet that can be seen with the naked eye twice in a human lifetime. In 1705 Edmond Halley calculated that comets seen in 1531, 1607 and 1682 were one object, and predicted its return in 1758. He was right.'],
 [['Kemunculannya tercatat sejak setidaknya 240 SM dan tergambar di Permadani Bayeux tahun 1066.','Ekornya selalu menjauhi Matahari karena didorong angin Matahari dan tekanan cahaya, bukan karena arah geraknya.'],['Its appearances are recorded since at least 240 BCE, and it is shown on the Bayeux Tapestry of 1066.','Its tail always points away from the Sun, pushed by the solar wind and sunlight, not by its direction of motion.']],{refs:[nasa('/solar-system/comets/1p-halley/'),wiki("Halley's_Comet")],view:11.6}),
'Komet Encke':O('sml',{orbit:{q:.3360,e:.8471,i:11.35,O:334.2,w:186.5,Tp:'2023-10-22T00:00Z'}},['Komet','Comet'],[[['Periode','3,3 tahun'],['Perihelion','~0,34 AU']],[['Period','3.3 years'],['Perihelion','~0.34 AU']]],
 ['Komet dengan periode terpendek di antara komet yang cukup besar: hanya 3,3 tahun. Debu yang ditinggalkannya di sepanjang orbit menjadi sumber hujan meteor Taurid setiap Oktober–November.','The comet with the shortest period among sizable comets: just 3.3 years. Dust it leaves along its orbit causes the Taurid meteor shower every October–November.'],
 [['Orbitnya membawanya lebih dekat ke Matahari daripada Merkurius.'],['Its orbit takes it closer to the Sun than Mercury.']],{refs:[wiki('Comet_Encke')],view:11.0}),
'Komet Hale-Bopp':O('sml',{orbit:{q:.9141,e:.99509,i:89.43,O:282.47,w:130.59,Tp:'1997-04-01T03:00Z'}},['Komet','Comet'],[[['Periode','~2.500 tahun'],['Inti','~60 km'],['Puncak terang','1997']],[['Period','~2,500 years'],['Nucleus','~60 km'],['Peak brightness','1997']]],
 ['Salah satu komet paling banyak dilihat dalam sejarah: ia bisa dilihat mata telanjang selama sekitar 18 bulan pada 1996–1997, bahkan dari kota yang terang. Intinya sangat besar, sekitar 60 km, beberapa kali lebih besar dari inti Halley.','One of the most widely seen comets in history: visible to the naked eye for about 18 months in 1996–1997, even from bright cities. Its nucleus is huge, about 60 km, several times larger than Halley’s.'],
 [['Ia baru akan kembali ke tata surya bagian dalam sekitar tahun 4380.'],['It will not return to the inner solar system until around the year 4380.']],{refs:[wiki('Comet_Hale–Bopp')],view:12.0}),
'3I/ATLAS':O('sml',{orbit:{q:1.357,e:6.14,i:175.11,O:322.16,w:128.01,Tp:'2025-10-29T12:00Z'}},['Komet antarbintang','Interstellar comet'],[[['Ditemukan','1 Juli 2025'],['Perihelion','~30 Okt 2025, ~1,4 AU'],['Kecepatan','~58 km/detik']],[['Discovered','July 1, 2025'],['Perihelion','~Oct 30, 2025, ~1.4 AU'],['Speed','~58 km/s']]],
 ['Objek antarbintang ketiga yang pernah ditemukan, setelah ‘Oumuamua (2017) dan 2I/Borisov (2019). Orbitnya hiperbolik: ia hanya numpang lewat dan tidak akan pernah kembali. Komet ini lahir di sekitar bintang lain dan mungkin jauh lebih tua dari tata surya kita. Elemen orbit di simulasi ini adalah perkiraan.','The third interstellar object ever found, after ‘Oumuamua (2017) and 2I/Borisov (2019). Its orbit is hyperbolic: it is just passing through and will never return. It formed around another star and may be far older than our solar system. The orbital elements in this simulation are approximate.'],
 [['Orbitnya hampir berlawanan arah dengan arah gerak planet (retrograd).'],['It moves almost opposite to the planets’ direction (retrograde).']],{refs:[nasa('/solar-system/comets/3i-atlas/'),wiki('3I/ATLAS')],view:11.8}),
'Apophis':O('sml',{orbit:{a:.9224,e:.1914,i:3.34,O:203.96,w:126.6,near:'2029-04-13T21:46Z'}},['Asteroid dekat Bumi','Near-Earth asteroid'],[[['Ukuran','~340 m'],['Lintasan terdekat','13 April 2029'],['Jarak dari permukaan','~32.000 km']],[['Size','~340 m'],['Closest pass','April 13, 2029'],['Distance from surface','~32,000 km']]],
 ['Pada 13 April 2029, Apophis akan melintas sekitar 32.000 km dari permukaan Bumi, lebih dekat daripada satelit geostasioner, dan terlihat mata telanjang dari sebagian wilayah Bumi. Pengamatan radar pada 2021 memastikan tidak ada risiko tabrakan setidaknya selama 100 tahun ke depan. Elemen orbit di simulasi ini adalah perkiraan.','On April 13, 2029, Apophis will pass about 32,000 km above Earth’s surface, closer than geostationary satellites, and will be visible to the naked eye from parts of the world. Radar observations in 2021 ruled out any impact risk for at least the next 100 years. The orbital elements in this simulation are approximate.'],
 [['Wahana OSIRIS-APEX dijadwalkan menemaninya setelah lintasan dekat itu.'],['The OSIRIS-APEX spacecraft is set to rendezvous with it after the close pass.']],{refs:[nasa('/solar-system/asteroids/apophis/'),wiki('99942_Apophis')],view:10.0}),
'Didymos':O('imp',{orbit:{a:1.6427,e:.3832,i:3.41,O:73.2,w:319.3,near:'2022-09-26T23:14Z'}},['Asteroid · uji tumbukan','Asteroid · impact test'],[[['Misi','DART (NASA)'],['Tumbukan','26 September 2022'],['Perubahan orbit','32 menit lebih cepat']],[['Mission','DART (NASA)'],['Impact','September 26, 2022'],['Orbit change','32 minutes shorter']]],
 ['Sistem asteroid ganda: Didymos (~780 m) dan bulan kecilnya Dimorphos (~160 m). Wahana DART sengaja ditabrakkan ke Dimorphos dan memperpendek orbitnya dari 11 jam 55 menit menjadi sekitar 11 jam 23 menit. Ini uji pertama manusia untuk membelokkan asteroid demi melindungi Bumi. Elemen orbit di simulasi ini adalah perkiraan.','A binary asteroid: Didymos (~780 m) and its small moon Dimorphos (~160 m). The DART spacecraft deliberately crashed into Dimorphos, shortening its orbit from 11 h 55 min to about 11 h 23 min: humanity’s first test of deflecting an asteroid to protect Earth. The orbital elements in this simulation are approximate.'],
 [['Wahana Hera milik ESA diluncurkan pada 2024 untuk memeriksa bekas tumbukan itu.'],['ESA’s Hera spacecraft launched in 2024 to inspect the aftermath.']],{refs:[nasa('/mission/dart/'),wiki('Double_Asteroid_Redirection_Test')],view:10.0}),
/* surface sites */
'Chicxulub':O('imp',{surf:['Bumi',21.3,-89.5]},['Kawah tumbukan','Impact crater'],[[['Umur','~66 juta tahun'],['Diameter kawah','~180 km'],['Penabrak','asteroid ~10 km']],[['Age','~66 million years'],['Crater diameter','~180 km'],['Impactor','~10 km asteroid']]],

 ['Sebuah meteoroid atau komet kecil meledak beberapa kilometer di atas Siberia dan meratakan sekitar 80 juta pohon. Tidak ada kawah, karena benda itu hancur sebelum menyentuh tanah. Ini peristiwa tumbukan terbesar dalam sejarah modern.','A meteoroid or small comet exploded a few kilometers above Siberia, flattening about 80 million trees. There is no crater, because the object disintegrated before reaching the ground. It is the largest impact event in recorded history.'],

 ['Kawah tumbukan terbesar yang terverifikasi di Bumi, di Afrika Selatan. Erosi selama miliaran tahun telah menghapus kawah aslinya; yang tersisa adalah cincin perbukitan dan batuan yang terguncang tumbukan.','The largest verified impact structure on Earth, in South Africa. Billions of years of erosion have erased the original crater; what remains is a ring of hills and shock-altered rock.'],
